name: Check cluster

# Prints current stack outputs and runs `pulumi preview` to report drift
# between live infrastructure and the config files. Changes nothing.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Cloud provider"
        required: true
        type: choice
        options:
          - aws
        default: aws

jobs:
  cluster:
    uses: sinan-ozel/k3s-anywhere/.github/workflows/cluster.yaml@v0.2.12
    with:
      provider: ${{ inputs.provider }}
      config: infrastructure/configs/csqe
      provider_config: infrastructure/configs/${{ inputs.provider }}/csqe
      action: check
      # See provision.yaml — cluster.yaml's own `image` default lags behind
      # its @vX.Y.Z ref, so pin it explicitly.
      image: sinanozel/k3s-anywhere:0.2.12
    secrets: inherit
