# ── Image registry ────────────────────────────────────────────────────────
image:
  registry: docker.io
  # Your Docker Hub username or org. Required.
  organization: ""
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion when blank.
  tag: ""

# ── Ingestion pipeline toggle ───────────────────────────────────────────────
# Set false to deploy a query-only stack (Fuseki/Redis/MinIO/mcp-server/
# dashboard, no pdf-worker/graph-worker/llmServer) — e.g. after restoring a
# graph from backup onto cheap CPU-only infrastructure with no GPU node.
ingest:
  enabled: true

# ── Per-component replicas & resources ────────────────────────────────────
server:
  replicaCount: 1
  logLevel: "info"
  resources: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []

pdfWorker:
  replicaCount: 1
  logLevel: "info"
  lockTtlSeconds: 120
  pollIntervalSeconds: 5
  resources: {}

graphWorker:
  replicaCount: 1
  logLevel: "info"
  # LiteLLM-compatible endpoint for entity extraction. Ignored (and
  # overridden by the in-cluster llm-server) when llmServer.enabled=true.
  llamaCppHost: "http://host.docker.internal:8080/v1"
  # Token budget passed to the chunker and to max_tokens = contextWindow / 4.
  contextWindow: 8192
  lockTtlSeconds: 300
  pollIntervalSeconds: 10
  resources: {}

# ── LLM server (GPU node) ───────────────────────────────────────────────────
# Self-hosted OpenAI-compatible llama.cpp server, scheduled onto the node
# labeled by k3s-anywhere's GPU cloud-init. Set false to fall back to
# graphWorker.llamaCppHost (an external LLM endpoint).
llmServer:
  enabled: false
  image:
    repository: sinanozel/llama.cuda-12g
    tag: qwen3.5-9b
  port: 8080
  extraArgs: []
  nodeSelector:
    k3s-anywhere.io/gpu-node: "true"
  resources:
    limits:
      nvidia.com/gpu: 1

# ── NVIDIA device plugin ────────────────────────────────────────────────────
# Advertises nvidia.com/gpu as allocatable on the GPU node. Only meaningful
# (and only deployed) alongside llmServer.
nvidiaDevicePlugin:
  image:
    repository: nvcr.io/nvidia/k8s-device-plugin
    tag: v0.17.0

dashboard:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8501
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []
  resources: {}

# ── MCP Inspector ────────────────────────────────────────────────────────
# Visual debugger for the /mcp endpoint. DANGEROUSLY_OMIT_AUTH is
# deliberately never set here (that's a local-docker-compose-only
# convenience) — the Inspector's own MCP_PROXY_AUTH_TOKEN gates access;
# retrieve it with `kubectl logs`.
inspector:
  enabled: false
  image:
    repository: ghcr.io/modelcontextprotocol/inspector
    tag: latest
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []
  resources: {}

# ── Public domain + TLS ─────────────────────────────────────────────────────
# Hostname used by server/dashboard/inspector Ingress resources, e.g. a
# nip.io hostname derived from an Elastic IP when there's no real DNS.
domain: ""

certManager:
  enabled: false
  issuer:
    email: ""
    # Staging by default: nip.io subdomains likely share Let's Encrypt's
    # rate-limit bucket for the parent domain, so staging avoids burning
    # the prod quota during iterative provision/teardown cycles. Point at
    # https://acme-v02.api.letsencrypt.org/directory for a long-lived
    # deployment with a real, trusted cert.
    server: https://acme-staging-v02.api.letsencrypt.org/directory

# ── Fuseki (triple store) ─────────────────────────────────────────────────
fuseki:
  # Set false to point at an existing Fuseki instance via external.endpoint.
  enabled: true
  adminUser: "admin"
  adminPassword: "changeme"
  jvmArgs: "-Xmx4g"
  storage:
    # Sized for a handful of test sourcebooks on k3s-anywhere's default
    # DISK_SIZE_GB=60 node disk — Longhorn requires this much *theoretical*
    # capacity to schedule a replica regardless of actual usage, and with
    # numberOfReplicas=2 each node needs room for one full replica of every
    # volume below simultaneously. Bump alongside DISK_SIZE_GB (and the
    # other sizes here) for a real book collection.
    size: 5Gi
    storageClass: ""
  external:
    endpoint: ""  # e.g. http://my-fuseki:3030/campaign

# ── Redis (queue + state) ─────────────────────────────────────────────────
redis:
  enabled: true
  storage:
    size: 10Gi
    storageClass: ""
  external:
    url: ""  # e.g. redis://my-redis:6379

# ── MinIO (object store for raw PDFs and markdown) ───────────────────────
minio:
  enabled: true
  rootUser: minioadmin
  rootPassword: "changeme"
  storage:
    # See fuseki.storage.size above re: sizing against DISK_SIZE_GB.
    size: 10Gi
    storageClass: ""
  external:
    endpoint: ""      # e.g. http://my-minio:9000
    accessKey: ""
    secretKey: ""

# ── Input volume (drop PDFs here to ingest) ───────────────────────────────
# Folder structure encodes metadata:
#   input/3e/canon/eberron/book.pdf  → edition=3e, canon_type=canon, tag=eberron
# Supported edition tokens : 3e, 4e, 5e, any
# Supported canon_type tokens: canon, kanon, community
input:
  storage:
    # See fuseki.storage.size above re: sizing against DISK_SIZE_GB.
    size: 5Gi
    storageClass: ""

# ── Chunks scratch space ──────────────────────────────────────────────────
chunks:
  storage:
    # See fuseki.storage.size above re: sizing against DISK_SIZE_GB.
    size: 5Gi
    storageClass: ""

# ── Override bundled config files ─────────────────────────────────────────
# Leave blank to use the defaults shipped with the chart.
fusekiConfig: ""      # content of fuseki-config.ttl
ontologySchema: ""    # content of ontology_schema.yaml
ingestionConfig: ""   # content of ingestion_config.yaml
llmConfig: ""         # content of llm.yaml
