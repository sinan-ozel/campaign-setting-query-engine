{{- if .Values.inspector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-inspector
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "csqe.selectorLabels" (dict "root" . "component" "inspector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "csqe.selectorLabels" (dict "root" . "component" "inspector") | nindent 8 }}
    spec:
      containers:
        - name: inspector
          image: "{{ .Values.inspector.image.repository }}:{{ .Values.inspector.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Auth is left on (no DANGEROUSLY_OMIT_AUTH) — this is reachable
          # over the public internet. Get the MCP_PROXY_AUTH_TOKEN with
          # `kubectl logs deploy/{{ .Release.Name }}-inspector`.
          # inspector 2.x replaced the old `node /app/client/bin/start.js`
          # entrypoint with an installed `mcp-inspector` CLI, and renamed the
          # "streamable-http" transport to plain "http".
          command: ["mcp-inspector"]
          args: ["--web", "--transport", "http", "--server-url", "http://{{ .Release.Name }}-server:8000/mcp"]
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: ALLOWED_ORIGINS
              value: {{ printf "https://%s" (include "csqe.ingressHost" (dict "root" . "explicit" .Values.inspector.ingress.host "prefix" "inspector")) | quote }}
          ports:
            - containerPort: 6274
            - containerPort: 6277
          resources:
            {{- toYaml .Values.inspector.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-inspector
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "csqe.selectorLabels" (dict "root" . "component" "inspector") | nindent 4 }}
  ports:
    - name: ui
      port: 6274
      targetPort: 6274
    - name: proxy
      port: 6277
      targetPort: 6277
---
{{- if .Values.inspector.ingress.enabled }}
{{- $host := include "csqe.ingressHost" (dict "root" . "explicit" .Values.inspector.ingress.host "prefix" "inspector") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-inspector
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
  annotations:
    {{- include "csqe.ingressAnnotations" (dict "root" . "annotations" .Values.inspector.ingress.annotations) | nindent 4 }}
spec:
  {{- with .Values.inspector.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- $tls := include "csqe.ingressTls" (dict "root" . "tls" .Values.inspector.ingress.tls "host" $host "secretName" (printf "%s-inspector-tls" .Release.Name)) }}
  {{- if $tls }}
  tls:
    {{- $tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-inspector
                port:
                  number: 6274
{{- end }}
{{- end }}
