apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "csqe.selectorLabels" (dict "root" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "csqe.selectorLabels" (dict "root" . "component" "dashboard") | nindent 8 }}
    spec:
      containers:
        - name: dashboard
          image: {{ include "csqe.image" (dict "root" . "suffix" "-dashboard") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MCP_SERVER_URL
              value: "http://{{ .Release.Name }}-server:8000"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - containerPort: 8501
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.dashboard.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    {{- include "csqe.selectorLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: 8501
---
{{- if .Values.dashboard.ingress.enabled }}
{{- $host := include "csqe.ingressHost" (dict "root" . "explicit" .Values.dashboard.ingress.host "prefix" "") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
  annotations:
    {{- include "csqe.ingressAnnotations" (dict "root" . "annotations" .Values.dashboard.ingress.annotations) | nindent 4 }}
spec:
  {{- with .Values.dashboard.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- $tls := include "csqe.ingressTls" (dict "root" . "tls" .Values.dashboard.ingress.tls "host" $host "secretName" (printf "%s-dashboard-tls" .Release.Name)) }}
  {{- if $tls }}
  tls:
    {{- $tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-dashboard
                port:
                  number: {{ .Values.dashboard.service.port }}
{{- end }}
