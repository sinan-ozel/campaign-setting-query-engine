name: Provision cluster

# Requires k3s-anywhere >= v0.2.9 (v0.1.7: GPU node fix — nvidia-container-toolkit
# + containerd runtime config + --node-label. v0.1.8: fetch.sh sops decrypt
# --input-type fix. v0.1.9: ACTION=check; fixes the GPU agent's cloud-init —
# ubuntu-drivers autoinstall instead of a pinned nvidia-driver-NNN package
# that silently failed on noble/24.04, and the k3s agent install command is
# now a YAML literal block so it isn't mangled into an unparseable line.
# v0.1.10: chmod -R a+r on provision output so non-root CI steps (e.g.
# sops-encrypt) can read it. v0.1.11: fixed a pipefail/SIGPIPE bug that
# deleted the live EC2 key pair on every re-provision. v0.2.0: AWS default
# node type t3.medium -> m6i.large — t3.medium's CPU-credit throttling
# risked the control plane/etcd. v0.2.1: GPU agents now reboot after the
# driver install before finishing containerd/k3s setup — ubuntu-drivers
# autoinstall could pull a newer kernel without rebooting into it, so
# nvidia-smi and the nvidia containerd runtime never worked and the GPU
# node hung forever without joining the cluster. v0.2.2: nvidia-ctk now runs
# with --set-as-default — without it, containerd's CRI plugin defaulted to a
# "runc" runtime that was never defined, so it refused to load and the GPU
# agent still hung on "Waiting for containerd startup" even after v0.2.1.
# v0.2.3: current nvidia-ctk releases write config.toml.tmpl as a drop-in
# stub with no `{{ template "base" . }}` directive, so k3s never injected
# its own CNI bin_dir/conf_dir — containerd fell back to its upstream
# default CNI path, which k3s never populates, and kubelet hung forever on
# "cni plugin not initialized" even though k3s-agent was running and the
# node had a pod CIDR. v0.2.4: post_provision.sh computed a node-count-aware
# Longhorn replica count but only passed it via
# defaultSettings.defaultReplicaCount, which only affects volumes created by
# hand through Longhorn's UI — the StorageClass PVCs actually use is
# controlled by persistence.defaultClassReplicaCount instead, left unset and
# silently defaulting to 3 regardless of cluster size, so every PVC below a
# 3-node cluster asked for more replicas than there were nodes and never
# attached. v0.2.5: v0.2.3's CNI fix inlined nvidia-ctk's `imports = [...]`
# stub verbatim, but that pointer's cross-file merge into k3s's base
# config silently dropped default_runtime_name (a sibling scalar in a
# table k3s's base template already declares) — GPU nodes joined Ready and
# nvidia-smi worked on the host, but every pod without an explicit
# RuntimeClass still ran under plain runc with no /dev/nvidia* devices, so
# nvidia-device-plugin crash-looped with "Incompatible strategy detected
# auto". Now inlines the drop-in's actual resolved content instead of the
# imports pointer, so k3s templates and merges it in a single pass.
# v0.2.6: v0.2.5 parsed the stub's `imports = [...]` line as text to find
# the drop-in's path, but that exact text format changed again on a fresh
# install and the empty match fed `grep` no filename — it read stdin, hit
# immediate EOF under systemd, and `set -e` killed the whole
# k3s-gpu-finish script before it ever reached the k3s join, taking
# k3s-agent.service down with it since it renders the same half-written
# config.toml.tmpl on every start. Now globs the drop-in's fixed directory
# instead of parsing stub text. v0.2.7: reverted v0.2.5/v0.2.6 entirely —
# inlining the drop-in's content (whichever way it's located) declares
# `[plugins."io.containerd.grpc.v1.cri".containerd]` twice in one file,
# invalid TOML for a single document, and broke every GPU node's join
# outright on two separate live provisions. Back to byte-identical v0.2.4
# behavior. v0.2.8: found the real bug — config.toml.tmpl put the base
# directive before the `imports = [...]` stub, so that line rendered
# right after the base template's own last table header with no reset in
# between, and was very likely being parsed as `registry.imports` rather
# than the top-level `imports` key containerd looks for, silently
# no-opping the whole drop-in merge. Reordered so `imports` comes first,
# before any table headers are expanded — lands at document root without
# touching any table declaration, so it can't reintroduce v0.2.5/v0.2.6's
# crash. v0.2.9: confirmed live that v0.2.8's reorder does place `imports`
# at document root as intended, but that makes containerd's cross-file
# imports merge actually trigger for the first time (it silently never
# fired before) — and that merge replaces sibling settings under the
# shared `[plugins."io.containerd.grpc.v1.cri"]` parent instead of
# deep-merging them. The running containerd fell back to upstream default
# CNI paths even though config.toml on disk had k3s's correct values,
# reintroducing the original v0.2.2-era CNI bug. Reverted to
# byte-identical v0.2.7. The default_runtime_name gap remains open —
# the fix is a RuntimeClass, not a containerd default (see v0.2.10).
# v0.2.10: nvidia-container-toolkit is now version-pinned (was floating
# apt's latest at every GPU node boot, not just at image-build time — the
# same class of bug that caused v0.2.5/v0.2.6). k3s-anywhere's
# post_provision.sh now also auto-installs the "nvidia" RuntimeClass and
# nvidia-device-plugin DaemonSet whenever a GPU node is provisioned, the
# same way it already auto-installs Longhorn for storage — this chart's
# own runtimeclass-nvidia.yaml/nvidia-device-plugin.yaml templates are
# removed accordingly. llm-server still declares `runtimeClassName: nvidia`
# on its own pod spec, same as any GPU workload would.
# See ../../../k3s-anywhere's pulumi/aws and pulumi/exoscale
# cloud_init_agent(), and scripts/fetch/fetch.sh.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Cloud provider"
        required: true
        type: choice
        options:
          - aws
        default: aws

jobs:
  cluster:
    uses: sinan-ozel/k3s-anywhere/.github/workflows/cluster.yaml@v0.2.10
    with:
      provider: ${{ inputs.provider }}
      config: infrastructure/configs/csqe
      provider_config: infrastructure/configs/${{ inputs.provider }}/csqe
      action: provision
      # cluster.yaml's own `image` input default lags behind the workflow
      # ref it ships with — pin it explicitly or provisioning silently runs
      # whatever image that default points at, regardless of the @vX.Y.Z
      # ref above.
      image: sinanozel/k3s-anywhere:0.2.10
      # Replace with the age1... public key from `k3s: First-time setup
      # (AWS)` / `age-keygen` (see .github/SECRETS.md).
      sops_age_recipient: age1n7etqu9s3339aap0rusrvlvmrgxwjzmsv5xj9zruvuwf5gexddfqzemna7
    secrets: inherit
