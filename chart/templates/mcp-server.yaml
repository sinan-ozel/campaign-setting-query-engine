apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "csqe.selectorLabels" (dict "root" . "component" "mcp-server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "csqe.selectorLabels" (dict "root" . "component" "mcp-server") | nindent 8 }}
    spec:
      containers:
        - name: mcp-server
          image: {{ include "csqe.image" (dict "root" . "suffix" "") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: FUSEKI_ENDPOINT
              value: {{ include "csqe.fusekiEndpoint" . | quote }}
            - name: REDIS_URL
              value: {{ include "csqe.redisUrl" . | quote }}
            - name: MINIO_ENDPOINT
              value: {{ include "csqe.minioEndpoint" . | quote }}
            - name: MINIO_ACCESS_KEY
              value: {{ include "csqe.minioAccessKey" . | quote }}
            - name: MINIO_SECRET_KEY
              value: {{ include "csqe.minioSecretKey" . | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            - name: ONTOLOGY_SCHEMA_PATH
              value: /config/ontology_schema.yaml
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: config
              mountPath: /config/ontology_schema.yaml
              subPath: ontology_schema.yaml
              readOnly: true
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "csqe.selectorLabels" (dict "root" . "component" "mcp-server") | nindent 4 }}
  ports:
    - port: 8000
      targetPort: 8000
---
{{- if .Values.server.ingress.enabled }}
{{- $host := include "csqe.ingressHost" (dict "root" . "explicit" .Values.server.ingress.host "prefix" "mcp") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
  annotations:
    {{- include "csqe.ingressAnnotations" (dict "root" . "annotations" .Values.server.ingress.annotations) | nindent 4 }}
spec:
  {{- with .Values.server.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- $tls := include "csqe.ingressTls" (dict "root" . "tls" .Values.server.ingress.tls "host" $host "secretName" (printf "%s-server-tls" .Release.Name)) }}
  {{- if $tls }}
  tls:
    {{- $tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-server
                port:
                  number: 8000
{{- end }}
