name: Teardown cluster

# Three separate concerns, in order: purge -> backup -> teardown.
#   purge:    k3s-anywhere ACTION=purge, run as part of the backup job below
#             (see backup.yaml) so a full node disk from earlier failed
#             deploys can't starve a legitimate volume's replica and hang
#             its backup — this is exactly what happened to the fuseki
#             volume during development.
#   backup:   application-level (this project's job, not k3s-anywhere's) —
#             backs up fuseki/redis/minio volumes to S3. Pulled out into its
#             own reusable workflow (backup.yaml) so it can also be run
#             standalone, without tearing anything down. Teardown cannot
#             run until this succeeds.
#   teardown: k3s-anywhere ACTION=teardown, destroys the infra. The backup
#             bucket itself is protect=True in k3s-anywhere's Pulumi code,
#             so it (and anything already backed up) survives regardless.
# Restoring these backups onto a fresh cluster is what `deploy.yaml`'s
# `restore` job (and the "k3s: Restore from backup" task) does. For a
# personal copy of just the graph, independent of this S3 target, see
# download-backup/ (the "k3s: Download Fuseki backup" task) instead.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Cloud provider"
        required: true
        type: choice
        options:
          - aws
        default: aws
      cluster_name:
        description: "Cluster name (must match CLUSTER_NAME in infrastructure/configs/csqe.env)"
        default: campaign-setting-query-engine
        required: false
        type: string

jobs:
  backup:
    uses: ./.github/workflows/backup.yaml
    with:
      provider: ${{ inputs.provider }}
      cluster_name: ${{ inputs.cluster_name }}
    secrets: inherit

  cluster:
    needs: backup
    uses: sinan-ozel/k3s-anywhere/.github/workflows/cluster.yaml@v0.2.13
    with:
      provider: ${{ inputs.provider }}
      config: infrastructure/configs/csqe
      provider_config: infrastructure/configs/${{ inputs.provider }}/csqe
      action: teardown
      # See provision.yaml — cluster.yaml's own `image` default lags behind
      # its @vX.Y.Z ref, so pin it explicitly.
      image: sinanozel/k3s-anywhere:0.2.13
    secrets: inherit
