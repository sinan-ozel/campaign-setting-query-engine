# Default test compose — runs the mcp_server test suite.
# For per-service testing use the docker-compose.yml inside each subfolder:
#   tests/mcp_server/docker-compose.yml
#   tests/pdf_worker/docker-compose.yml
#   tests/graph_worker/docker-compose.yml
#   tests/integration/docker-compose.yml

services:
  mcp-server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mcp-server
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      - PYTHONUNBUFFERED=1

  test:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    container_name: test-runner
    depends_on:
      mcp-server:
        condition: service_healthy
    command: pytest --mcp-tools=http://mcp-server:8000 tests/ -v --tb=short
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
