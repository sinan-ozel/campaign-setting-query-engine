services:

  fuseki:
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: testpassword
      FUSEKI_DATASET_1: campaign
      JVM_ARGS: "-Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3030/$/ping || exit 1"]
      interval: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  mcp-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      FUSEKI_ENDPOINT: http://fuseki:3030/campaign
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      ONTOLOGY_SCHEMA_PATH: /config/ontology_schema.yaml
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../config/ontology_schema.yaml:/config/ontology_schema.yaml:ro
    depends_on:
      fuseki:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 5s
      retries: 10
      start_period: 15s

  test-runner:
    build:
      context: ../..
      dockerfile: tests/Dockerfile
    # --openapi-no-strict-example-checking: this server has real mutable
    # state (Redis-backed document counts), so structural (keys+types)
    # validation is used instead of exact-value example matching.
    # --openapi-ignore: /ingest (multipart/form-data — pytest-openapi only
    # ever sends JSON bodies) and the {document_id} routes (need a
    # pre-existing document the fresh test DB doesn't have) are excluded
    # from live contract execution but stay fully documented in
    # server/openapi_spec.py.
    command: pytest --openapi=http://mcp-server:8000 --openapi-no-strict-example-checking '--openapi-ignore=(^/ingest$$)|(\{document_id\})' --mcp-tools=http://mcp-server:8000 tests/mcp_server/ -v --tb=short
    environment:
      MCP_SERVER_URL: http://mcp-server:8000
      FUSEKI_ENDPOINT: http://fuseki:3030/campaign
      FUSEKI_ADMIN_PASSWORD: testpassword
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      mcp-server:
        condition: service_healthy
