namespace: "http://campaignsetting.io/ontology#"

# Changing anything in this file changes what the graph holds, so it requires a
# minor version bump in server/__init__.py (CI enforces this) and a re-ingest.
# chart/files/ontology_schema.yaml must stay an exact copy (CI checks that too).

# ── All types queryable via list_names / search_by_property / describe_schema ──
# To add a new queryable type: add an entry here AND an entity_type entry below.
queryable_types:
  # Characters
  NPC: NPC
  # Factions and social groups
  Faction: Faction
  Newspaper: Newspaper
  DragonmarkedHouse: DragonmarkedHouse
  Family: Family
  # Beliefs
  Religion: Religion
  Deity: Deity
  # Species and classes
  Race: Race
  CharacterClass: CharacterClass
  Skill: Skill
  Feat: Feat
  # Culture
  Language: Language
  Dialect: Dialect
  Creole: Creole
  Pidgin: Pidgin
  CodeLanguage: CodeLanguage
  Tradition: Tradition
  Dish: Dish
  Drink: Drink
  Wine: Wine
  Beer: Beer
  Spirit: Spirit
  Cocktail: Cocktail
  # Resources
  Material: Material
  Metal: Metal
  Gem: Gem
  Textile: Textile
  CraftingMaterial: CraftingMaterial
  # History
  Event: Event
  War: War
  Battle: Battle
  Treaty: Treaty
  Disaster: Disaster
  Founding: Founding
  Era: Era
  # Creatures
  Creature: Creature
  CreatureType: CreatureType
  Aberration: Aberration
  Beast: Beast
  Celestial: Celestial
  Construct: Construct
  Dragon: Dragon
  Elemental: Elemental
  Fey: Fey
  Fiend: Fiend
  Giant: Giant
  Humanoid: Humanoid
  Monstrosity: Monstrosity
  Ooze: Ooze
  Plant: Plant
  Undead: Undead
  # Locations — broad
  Location: Location
  Continent: Continent
  Nation: Nation
  Region: Region
  # Locations — settlements
  City: City
  Ward: Ward
  Neighborhood: Neighborhood
  Tavern: Tavern
  Restaurant: Restaurant
  Shop: Shop
  Mine: Mine
  Winery: Winery
  # Locations — terrain
  River: River
  Lake: Lake
  Sea: Sea
  Mountain: Mountain
  MountainRange: MountainRange
  Forest: Forest
  Jungle: Jungle
  Desert: Desert
  Plain: Plain
  Island: Island
  # Locations — structures and planes
  Dungeon: Dungeon
  Ruin: Ruin
  Plane: Plane
  Moon: Moon
  # Items
  Item: Item
  MagicItem: MagicItem
  WondrousItem: WondrousItem
  Attire: Attire
  Book: Book
  MagicArmor: MagicArmor
  MagicWeapon: MagicWeapon
  Potion: Potion
  Ring: Ring
  Rod: Rod
  Scroll: Scroll
  Staff: Staff
  Wand: Wand

# ── Traversable relationship edges (get_relationships) ────────────────────────
# key = name callers use in the API.
#   property:    cs: predicate suffix
#   direction:   out = (entity) -[property]-> (result)
#                in  = (result) -[property]-> (entity), i.e. the inverse reading
#   description: one line shown to the client model by describe_schema
#   derived:     computed at query time instead of read from one predicate
#                (capital: cities flagged as capitals, explicitly or by containment)
relationship_properties:
  # People and groups
  allies:
    property: alliedWith
    direction: out
    description: "NPC → NPCs it is allied with"
  enemies:
    property: enemyOf
    direction: out
    description: "NPC → NPCs it is an enemy of"
  sibling:
    property: siblingOf
    direction: out
    description: "NPC → its siblings"
  spouse:
    property: spouseOf
    direction: out
    description: "NPC → its spouse"
  memberOf:
    property: memberOf
    direction: out
    description: "NPC → factions, houses and families it belongs to"
  members:
    property: memberOf
    direction: in
    description: "Faction, house or family → its member NPCs"
  leader:
    property: leaderOf
    direction: in
    description: "Faction → the NPC who leads it"
  leaderOf:
    property: leaderOf
    direction: out
    description: "NPC → factions it leads"
  factionAllies:
    property: factionAlly
    direction: out
    description: "Faction → allied factions"
  factionEnemies:
    property: factionEnemy
    direction: out
    description: "Faction → enemy factions"
  headquarters:
    property: factionLocatedIn
    direction: out
    description: "Faction → location of its headquarters"
  memberFamilyOf:
    property: memberFamilyOf
    direction: out
    description: "Family → the dragonmarked house it belongs to"
  families:
    property: memberFamilyOf
    direction: in
    description: "Dragonmarked house → its families"
  operatesIn:
    property: operatesIn
    direction: out
    description: "Faction → locations where it operates"
  race:
    property: hasRace
    direction: out
    description: "NPC → its race"
  characterClass:
    property: hasClass
    direction: out
    description: "NPC → its class"
  nationality:
    property: nationality
    direction: out
    description: "NPC → its nation"
  locatedIn:
    property: locatedIn
    direction: out
    description: "NPC → where it is usually found"
  residents:
    property: locatedIn
    direction: in
    description: "Location → NPCs usually found there"
  equipment:
    property: hasEquipment
    direction: out
    description: "NPC → items it carries"
  # Religion
  worships:
    property: worships
    direction: out
    description: "NPC or faction → deity it worships"
  worshippers:
    property: worships
    direction: in
    description: "Deity → NPCs and factions that worship it"
  primaryDeity:
    property: primaryDeity
    direction: out
    description: "Religion → its primary deity"
  deityOf:
    property: deityOf
    direction: out
    description: "Deity → the religion it belongs to"
  # Places and government
  contains:
    property: contains
    direction: out
    description: "Location → locations directly inside it (see get_location_hierarchy for all levels)"
  containedIn:
    property: contains
    direction: in
    description: "Location → the location directly containing it"
  controlledBy:
    property: controlledBy
    direction: out
    description: "Location → faction controlling it"
  controls:
    property: controlledBy
    direction: in
    description: "Faction → locations it controls"
  capital:
    derived: capital
    status: current
    description: "Nation → its current capital city"
  formerCapitals:
    derived: capital
    status: former
    description: "Nation → cities that used to be its capital"
  capitalOf:
    property: capitalOf
    direction: out
    description: "City → the nation it is (or was) the capital of"
  ruler:
    property: ruledBy
    direction: out
    description: "Nation or region → its current ruler (NPC)"
  formerRulers:
    property: formerlyRuledBy
    direction: out
    description: "Nation or region → its past rulers (NPCs)"
  rules:
    property: ruledBy
    direction: in
    description: "NPC → nations or regions it currently rules"
  produces:
    property: produces
    direction: out
    description: "Location (mine, winery, brewery, region, nation) → materials and drinks made there"
  producedAt:
    property: produces
    direction: in
    description: "Material or drink → locations where it is produced"
  menu:
    property: servedIn
    direction: in
    description: "Location (city, tavern, restaurant) → dishes and drinks served there"
  servedIn:
    property: servedIn
    direction: out
    description: "Dish or drink → places where it is served"
  origin:
    property: originatesIn
    direction: out
    description: "Dish → the place it comes from"
  localDishes:
    property: originatesIn
    direction: in
    description: "Location → dishes that come from there (its cuisine)"
  manifestZoneOf:
    property: manifestZoneOf
    direction: out
    description: "Location → the plane it is a manifest zone of"
  manifestZones:
    property: manifestZoneOf
    direction: in
    description: "Plane → locations that are its manifest zones"
  # History
  participants:
    property: participant
    direction: out
    description: "Event → NPCs, factions and nations that took part"
  participatedIn:
    property: participant
    direction: in
    description: "NPC, faction or nation → events it took part in"
  eventLocation:
    property: occurredAt
    direction: out
    description: "Event → where it happened"
  events:
    property: occurredAt
    direction: in
    description: "Location → events that happened there"
  # Culture and language
  practicedBy:
    property: practicedBy
    direction: out
    description: "Tradition → nations, races or factions that practice it"
  traditions:
    property: practicedBy
    direction: in
    description: "Nation, race or faction → its traditions (fashion, etiquette, law, dance, ...)"
  spokenIn:
    property: spokenIn
    direction: out
    description: "Language → locations where it is spoken"
  languages:
    property: spokenIn
    direction: in
    description: "Location → languages spoken there"
  spokenByRace:
    property: spokenByRace
    direction: out
    description: "Language → races that speak it"
  spokenByFaction:
    property: spokenByFaction
    direction: out
    description: "Language → factions that use it"
  descendsFrom:
    property: descendsFrom
    direction: out
    description: "Language → languages it descends from"
  descendants:
    property: descendsFrom
    direction: in
    description: "Language → languages descended from it"
  dialectOf:
    property: dialectOf
    direction: out
    description: "Dialect → the language it is a dialect of"
  dialects:
    property: dialectOf
    direction: in
    description: "Language → its dialects"
  nativeRegions:
    property: nativeRegion
    direction: out
    description: "Race → its native regions"
  # Items and books
  author:
    property: author
    direction: out
    description: "Book → its author"
  wrote:
    property: author
    direction: in
    description: "NPC → books it wrote"
  writtenIn:
    property: writtenIn
    direction: out
    description: "Book → the language it is written in"
  # Creatures
  foundIn:
    property: foundIn
    direction: out
    description: "Creature → locations where it is found"
  creatures:
    property: foundIn
    direction: in
    description: "Location → creatures found there"

# ── Properties accepted by search_by_property and list_names filters ──────────
# Literal properties match the value; object properties match the linked
# entity's name (e.g. nationality = "Breland").
allowed_filter_properties:
  # Shared
  - description
  - alias
  - status
  - edition
  - canonType
  # NPC
  - nationality
  - alignment
  - ancestry
  - physicalDescription
  - level
  - wantsAndNeeds
  - worships
  - memberOf
  - leaderOf
  - locatedIn
  - hasRace
  - hasClass
  # Faction
  - factionType
  - dragonmark
  - factionLocatedIn
  - operatesIn
  # Location
  - climate
  - shopType
  - ambiance
  - controlledBy
  - capitalStatus
  - capitalOf
  - ruledBy
  - produces
  - manifestZoneOf
  - fromYear
  - untilYear
  # Race / feat / dish / drink / material
  - nativeRegion
  - prerequisites
  - cuisineType
  - originatesIn
  - servedIn
  - ingredient
  # Items and books
  - rarity
  - requiresAttunement
  - charges
  - author
  - writtenIn
  # Language
  - languageFamily
  - script
  - format
  - spokenIn
  - spokenByRace
  - descendsFrom
  - dialectOf
  # Event / tradition
  - startYear
  - endYear
  - occurredAt
  - participant
  - category
  - practicedBy
  # Creature
  - challengeRating
  - size
  - habitat
  - foundIn

# ── Entity types ───────────────────────────────────────────────────────────────
# Any entity_type with a llm_key is extracted by the LLM and written to the graph.
# Entity types without llm_key appear only in queryable_types (subtypes written
# as rdf:type triples by their parent entity's handler).
#
# Property maps drive the generic mapper — no Python changes needed to add fields:
#
#   datatype_properties:       {llm_field: cs_suffix}  scalar string → literal triple
#   list_datatype_properties:  {llm_field: cs_suffix}  list of strings → one triple each
#   object_properties:         {llm_field: cs_suffix}  name → URI, current → cs:prop → target
#   list_object_properties:    {llm_field: cs_suffix}  list of names → one URI triple each
#   reverse_object_properties: {llm_field: cs_suffix}  target → cs:prop → current
#                              (for parent_location → parent contains child,
#                               leader → leader leaderOf faction)
#   symmetric_object_properties: {llm_field: cs_suffix}  write both directions
#   reverse_list_object_properties: {llm_field: cs_suffix}  list of names, each
#                              target → cs:prop → current (members → NPC memberOf faction)
#   enum_datatype_properties:  {llm_field: {property: cs_suffix, values: [..]}}
#                              literal written only if the lowercased value is listed
#   integer_datatype_properties: {llm_field: cs_suffix}  first signed integer in the
#                              value → xsd:integer literal (years: "994 YK" → 994)
#
#   relationship_types:        dispatch table for the "relationships" array field
#     rel_type:
#       property: cs_suffix
#       symmetric: true|false
#
#   subtype_field: which LLM field selects a subclass of the root uri_suffix
#   subtypes:
#     LlmValue: ClassName           (string → explicit parent = uri_suffix)
#     LlmValue:                     (dict → explicit parents listed)
#       class: ClassName
#       parents: [ParentA, ParentB]
#
# To add a new simple field to an entity type: add one line under the right
# property map in that entity's section below. No Python edits needed.
entity_types:

  NPC:
    uri_suffix: NPC
    llm_key: npcs
    datatype_properties:
      description: description
      alignment: alignment
      ancestry: ancestry
      physical_description: physicalDescription
      level: level
      wants_and_needs: wantsAndNeeds
      secrets: secret
      actions: action
    list_datatype_properties:
      potential_goals: potentialGoal
    object_properties:
      race: hasRace
      character_class: hasClass
      nationality: nationality
      location: locatedIn
      worships: worships
    list_object_properties:
      equipment: hasEquipment
      factions: memberOf
    relationship_types:
      ally:
        property: alliedWith
        symmetric: false
      enemy:
        property: enemyOf
        symmetric: true
      sibling:
        property: siblingOf
        symmetric: true
      spouse:
        property: spouseOf
        symmetric: true
    notes: |
      NPCS: Extract ONLY specific, named individuals — a person who has a proper name
      and an established identity in the setting.
      REQUIRED: the entity must have a real proper name (e.g. "Lakashtai", "King Boranel",
      "Lord of Blades"). A title alone with no name does NOT qualify.
      DO NOT extract:
        - Character backgrounds or archetypes: "noble", "criminal", "urchin", "entertainer"
        - Generic roles: "the wizard", "the paladin", "a bard", "your character"
        - Hypothetical examples used to illustrate rules: "if you play a noble..."
        - Creature types or races: use creatures/races arrays for those
        - Player characters or player character options
        - Organizations or factions: use factions array for those
      GOOD examples: "Lakashtai", "Jaela Daran", "Boranel ir'Wynarn", "The Mourning King"
      BAD examples: "noble", "urchin", "wizard", "the bard", "a Boromar crime boss"
    llm_schema:
      name: "canonical name as written"
      aliases:
        - "titles, other names"
      race: "race name or null"
      ancestry: "specific lineage, heritage, or cultural background beyond race, or null"
      character_class: "class(es) like 'Fighter' or 'Fighter/Rogue' or null"
      level: "level like '5' or multiclass like 'Fighter 5/Rogue 3' or null"
      alignment: "alignment string or null"
      nationality: "nation name or null"
      location: "primary location or null"
      factions:
        - "faction names"
      worships: "deity name or null"
      physical_description: "brief physical appearance or null"
      equipment:
        - "item names this NPC carries or wears"
      potential_goals:
        - "brief goal description"
      wants_and_needs: "what this NPC fundamentally wants or needs or null"
      secrets: "information this NPC is hiding (GM note) or null"
      actions: "notable combat actions or special abilities or null"
      potential_motives:
        - summary: "one sentence"
          source_quote: "verbatim text or null"
      description: "brief description"
      relationships:
        - target: "entity name"
          type: "ally|enemy|rival|mentor|subordinate|sibling|spouse|other"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Location:
    uri_suffix: Location
    llm_key: locations
    notes: |
      LOCATIONS: Extract ONLY specifically named places with a proper name.
      REQUIRED: the place must have a distinct proper name — not just a description of terrain
      or a generic word like "the city" or "a tavern".
      DO NOT extract:
        - Generic terrain without a name: "the forest", "a river", "some mountains"
        - Generic structures: "a tavern", "the shop", "a dungeon", "the ruins"
        - Vague directional references: "the city to the north", "a nearby town"
        - Hypothetical or tutorial example places that are clearly made up to illustrate a rule
      GOOD examples: "Sharn", "Khorvaire", "The Mournland", "The Cogs", "Lake Galifar"
      BAD examples: "the city", "a tavern", "the forest", "some ruins", "a mysterious cave"
      NATION vs LANGUAGE — adjective and demonym forms: A proper nation name like "Breland"
      is a Location (type: Nation). The adjective or demonym form of a nation name — words
      ending in -ish, -an, -ite, -ese, -i, or similar that derive from a nation name —
      (e.g. "Brelish" from "Breland", "Aundairian" from "Aundair", "Karrnathi" from "Karrnath")
      is almost always a LANGUAGE, not a Location. Put the adjective form in the languages array,
      not locations. Extract the nation as a Location; extract its adjective form as a Language.
      WATER — pick the type by what the water is, not by guessing:
        - River: a flowing watercourse only ("Brey River", "Dagger River").
        - Lake: an inland body of still water — names with "Lake", "Loch", "Mere", "Pond"
          ("Lake Galifar", "Lake Cyre").
        - Sea: seas, oceans, bays, gulfs, sounds, straits ("Lhazaar Sea", "Thunder Sea").
        A lake is NEVER a River.
      MINE / WINERY: a named mine, quarry or dig is type Mine; a named vineyard, winery or
      distillery is type Winery. List what they produce in "produces".
      EATING, DRINKING, SHOPPING:
        - Tavern: taverns, inns, pubs, alehouses and breweries (a brewery is a Tavern; list
          its beers in "produces").
        - Restaurant: places whose business is serving meals — restaurants, eateries, food
          halls, cafés. Not a Tavern.
        - Shop: places that sell products. Set shop_type to one of: general store,
          blacksmith, armorer, weaponsmith, florist, magic shop, alchemist, apothecary,
          tailor, cobbler, jeweler, bookshop, spice shop, bakery, butcher, grocer,
          vendor stall, pawn shop, curio shop, other. Places that sell a service (lodging,
          meals, drinks) are NOT shops.
      CAPITALS: if the text says a city is (or was) the capital of a nation, set is_capital to
      "current" (or "former") and capital_of to the nation's name. Otherwise leave both null.
      RULERS: for a nation or region, set ruler to the NPC who rules it now, and former_rulers
      to rulers the text says ruled it in the past.
      STATUS: "past" if the place no longer exists or no longer exists in that form (destroyed,
      fallen, sunk, a former kingdom or empire such as Galifar or Cyre); otherwise "current".
      YEARS: from_year / until_year only when the text states the year outright. Copy the
      number as written in YK (Year of the Kingdom); years before YK are negative. Never
      calculate a year. If no year is stated, use null.
      MANIFEST ZONES: if the text says the place is a manifest zone of a plane, put the plane's
      name in manifest_zone_of.
    subtype_field: type
    subtypes:
      Continent: Continent
      Nation: Nation
      Region: Region
      City: City
      Ward: Ward
      Neighborhood: Neighborhood
      Tavern: Tavern
      Restaurant: Restaurant
      Shop: Shop
      Mine: Mine
      Winery: Winery
      River: River
      Lake: Lake
      Sea: Sea
      Mountain: Mountain
      MountainRange: MountainRange
      Forest: Forest
      Jungle: Jungle
      Desert: Desert
      Plain: Plain
      Island: Island
      Dungeon: Dungeon
      Ruin: Ruin
      Plane: Plane
      Moon: Moon
    datatype_properties:
      description: description
      climate: climate
      ambiance_description: ambiance
    enum_datatype_properties:
      status:
        property: status
        values: [current, past]
      is_capital:
        property: capitalStatus
        values: [current, former]
      shop_type:
        property: shopType
        values:
          - general store
          - blacksmith
          - armorer
          - weaponsmith
          - florist
          - magic shop
          - alchemist
          - apothecary
          - tailor
          - cobbler
          - jeweler
          - bookshop
          - spice shop
          - bakery
          - butcher
          - grocer
          - vendor stall
          - pawn shop
          - curio shop
          - other
    integer_datatype_properties:
      from_year: fromYear
      until_year: untilYear
    object_properties:
      controlling_faction: controlledBy
      capital_of: capitalOf
      ruler: ruledBy
      manifest_zone_of: manifestZoneOf
    list_object_properties:
      former_rulers: formerlyRuledBy
      produces: produces
    reverse_object_properties:
      # parent_location → parent cs:contains current (subject is the parent)
      parent_location: contains
    reverse_list_object_properties:
      # notable NPC → cs:locatedIn → current location
      notable_npcs: locatedIn
    llm_schema:
      name: "canonical name"
      aliases:
        - "other names"
      type: "Continent|Nation|Region|City|Ward|Neighborhood|Tavern|Restaurant|Shop|Mine|Winery|River|Lake|Sea|Mountain|MountainRange|Forest|Jungle|Desert|Plain|Island|Dungeon|Ruin|Plane|Moon|Other"
      status: "current|past"
      shop_type: "only for type Shop: kind of shop from the list in the notes, or null"
      from_year: "YK year founded or first existing, as written in the text, or null"
      until_year: "YK year destroyed or ended, as written in the text, or null"
      parent_location: "immediately containing location or null"
      is_capital: "current|former|null — only for capital cities"
      capital_of: "nation this city is or was the capital of, or null"
      ruler: "NPC who rules this nation or region now, or null"
      former_rulers:
        - "NPCs who ruled it in the past"
      controlling_faction: "faction name or null"
      produces:
        - "materials or drinks produced here (ores, gems, textiles, wines)"
      manifest_zone_of: "plane this place is a manifest zone of, or null"
      climate: "climate description or null"
      ambiance_description: "atmosphere, mood, sensory details or null"
      description: "brief description"
      notable_npcs:
        - "NPC names"
      connected_locations:
        - "location names"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Faction:
    uri_suffix: Faction
    llm_key: factions
    notes: |
      FACTIONS: Extract ONLY named organizations or groups with a distinct proper name.
      Includes guilds, crime families, dragonmarked houses, military orders, spy agencies,
      newspapers, noble houses, merchant consortiums, and religious orders.
      REQUIRED: must have a proper name — not a generic role or category label.
      DO NOT extract:
        - Generic group references: "the guards", "bandits", "the army", "the watch"
        - Government titles without a name: "the crown", "the council", "the senate"
        - Cultural or racial groups: "the elves", "humans", "Aundairians"
        - Vague references: "a criminal organization", "some mercenaries", "the enemy"
      GOOD examples: "House Cannith", "The Boromar Clan", "The Royal Eyes of Aundair", "The Sharn Watch"
      BAD examples: "the guards", "bandits", "the army", "an adventuring party", "the thieves"
    subtype_field: faction_class
    subtypes:
      Newspaper: Newspaper
      DragonmarkedHouse: DragonmarkedHouse
      Family: Family
    datatype_properties:
      description: description
      type: factionType
      dragonmark: dragonmark
    object_properties:
      headquarters: factionLocatedIn
      parent_house: memberFamilyOf
      worships: worships
    reverse_object_properties:
      # leader → leader cs:leaderOf current faction (subject is the leader)
      leader: leaderOf
    reverse_list_object_properties:
      # member NPC → cs:memberOf → current faction
      members: memberOf
    list_object_properties:
      operates_in: operatesIn
    symmetric_object_properties:
      allies: factionAlly
      enemies: factionEnemy
    llm_schema:
      name: "canonical name"
      aliases:
        - "other names"
      faction_class: "Faction|Newspaper|DragonmarkedHouse|Family"
      type: "Military|Criminal|Religious|Political|Mercantile|Arcane|Druidic|Press|Noble|Other"
      headquarters: "location name or null"
      leader: "NPC name or null"
      dragonmark: "name of the dragonmark this house bears, or null"
      parent_house: "DragonmarkedHouse name if this is a Family, or null"
      members:
        - "notable NPC names"
      potential_motives:
        - summary: "one sentence"
          source_quote: "text or null"
      allies:
        - "faction names"
      enemies:
        - "faction names"
      operates_in:
        - "location names"
      worships: "deity name or null"
      description: "brief description"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Religion:
    uri_suffix: Religion
    llm_key: religions
    notes: |
      RELIGIONS: Extract ONLY named religious systems, faiths, or organized spiritual movements.
      REQUIRED: must be a named faith or system — individual deities go in the deities array.
      DO NOT extract:
        - Individual divine beings: put those in the deities array instead
        - Abstract concepts: "worship", "faith", "prayer", "divine magic", "spirituality"
        - Generic references: "a religion", "the faith", "their beliefs", "the church"
      GOOD examples: "The Silver Flame", "The Sovereign Host", "The Blood of Vol", "Path of Light"
      BAD examples: "The Traveler" (deity — use deities), "worship", "faith", "the church"
    datatype_properties:
      description: description
    object_properties:
      primary_deity: primaryDeity
    llm_schema:
      name: "canonical religion name"
      aliases:
        - "other names"
      primary_deity: "deity name or null"
      deities:
        - "all associated deity names"
      worshipping_factions:
        - "faction names"
      dominant_in:
        - "nation names"
      description: "brief description"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Deity:
    uri_suffix: Deity
    llm_key: deities
    notes: |
      DEITIES: Extract ONLY named divine beings, gods, or named spiritual entities.
      REQUIRED: must be a named individual divine being with a proper name or established title.
      DO NOT extract:
        - Religious systems or faiths: put those in the religions array instead
        - Abstract concepts: "the divine", "godhood", "divine power", "holy energy"
        - Generic references: "a god", "the deity", "divine beings", "the gods" (plural generic)
      GOOD examples: "Boldrei", "The Traveler", "The Devourer", "The Keeper", "Vol", "Aureon"
      BAD examples: "god", "divine", "the gods", "divine power", "a dark deity"
    datatype_properties:
      description: description
      alignment: alignment
    object_properties:
      religion: deityOf
    llm_schema:
      name: "canonical deity name"
      aliases:
        - "titles, epithets"
      religion: "parent religion or null"
      alignment: "alignment or null"
      domains:
        - "divine domain names"
      description: "brief description"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Race:
    uri_suffix: Race
    llm_key: races
    notes: |
      RACES: Extract ONLY named biological species or ancestry types that characters can belong to.
      REQUIRED: must be a proper named species — not a nationality, profession, or background.
      DO NOT extract:
        - Nationalities or cultural identities: "Aundairian", "Karrnathi", "Cyran" — those are not races
        - Character backgrounds: "noble", "criminal", "soldier", "sage", "folk hero"
        - Generic humanoid groupings: "humanoid", "mortal", "the people", "men"
        - Creatures already in the creatures array: use creatures for monster species
      GOOD examples: "Warforged", "Kalashtar", "Changeling", "Shifter", "Half-Elf", "Gnome"
      BAD examples: "Aundairian" (nationality), "noble" (background), "humanoid" (generic), "soldier"
    datatype_properties:
      description: description
    list_object_properties:
      native_regions: nativeRegion
    llm_schema:
      name: "canonical race name"
      aliases:
        - "other names or subtypes"
      description: "brief description"
      typical_classes:
        - "class names"
      native_regions:
        - "location names"
      notable_npcs:
        - "named individuals"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  CharacterClass:
    uri_suffix: CharacterClass
    llm_key: classes
    datatype_properties:
      description: description
    notes: |
      CLASSES: Extract ONLY named character classes, subclasses, archetypes, prestige classes,
      and character templates that players can take.
      REQUIRED: must be a named class or specialization that characters can pursue.
      DO NOT extract:
        - Character backgrounds: "criminal", "noble", "sailor", "hermit", "sage" — NOT classes
        - Passive racial traits: "Dragonmark" (a mark you are born with), "Shifting" (a Shifter's
          racial ability) — NOT classes. However, if a lycanthrope template or form is presented
          as a CHARACTER OPTION players can take (e.g. "Afflicted Werewolf", "Natural Lycanthrope",
          "Werewolf [template]"), that IS a class — extract it.
        - Generic concepts: "magic-user", "warrior", "healer", "fighter type"
      GOOD examples: "Artificer", "Battle Smith", "Fashion Designer", "Circle of the Moon",
        "Battle Master", "Afflicted Werewolf", "Natural Werewolf", "Lycanthrope [template]"
      BAD examples: "criminal" (background), "noble" (background), "magic-user" (generic),
        "Shifting" (passive racial feature, not a selectable class)
    llm_schema:
      name: "canonical class name"
      aliases:
        - "variants"
      description: "brief description"
      associated_skills:
        - "skill names"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Skill:
    uri_suffix: Skill
    llm_key: skills
    datatype_properties:
      description: description
    notes: |
      SKILLS: Extract ONLY named discrete abilities, powers, or proficiencies characters can use.
      REQUIRED: must have a specific proper name — not a generic game mechanic concept.
      DO NOT extract:
        - Abstract mechanics: "proficiency", "advantage", "expertise", "spell slot", "bonus action"
        - Generic concepts: "magic", "combat training", "stealth" (unless it is a named skill)
        - Class features that are not named abilities
      GOOD examples: "Telekinesis", "Mind Blast", "Sneak Attack", "Arcana", "Channel Divinity"
      BAD examples: "proficiency", "advantage", "spellcasting" (generic), "combat ability", "bonus action"
    llm_schema:
      name: "canonical skill name"
      aliases:
        - "other names"
      description: "brief description"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Feat:
    uri_suffix: Feat
    llm_key: feats
    datatype_properties:
      description: description
      prerequisites: prerequisites
    notes: |
      FEATS: Extract ONLY named character-build options that players select: feats and passive
      special abilities taken at level-up.
      REQUIRED: must be a distinct named feat or talent a character can choose to take.
      DO NOT extract:
        - Active combat abilities or powers: use skills array for those
        - Abstract game mechanics: "bonus action", "reaction", "saving throw", "hit points"
        - Class or racial features that are not standalone selectable feats
      GOOD examples: "War Caster", "Alert", "Psionic Adept", "Sentinel", "Mage Slayer"
      BAD examples: "bonus action", "proficiency bonus", "saving throw advantage", "extra attack"
    llm_schema:
      name: "canonical feat name"
      aliases:
        - "other names"
      description: "what this feat grants"
      prerequisites: "requirements to take this feat or null"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Dish:
    uri_suffix: Dish
    llm_key: dishes
    datatype_properties:
      description: description
      cuisine_type: cuisineType
    list_datatype_properties:
      ingredients: ingredient
    object_properties:
      origin_location: originatesIn
    list_object_properties:
      served_in: servedIn
    notes: |
      DISHES: Extract ONLY named specific foods or culinary preparations. FOOD ONLY.
      REQUIRED: must be a named dish — not a generic food category or occasion.
      Drinks (wine, beer, spirits, cocktails, teas) go in the drinks array, NOT here.
      Short entries count: a one-line item in a menu, list or box ("Brelish Shawarma with
      Goblin sauce") is a dish; extract it even without a description.
      origin_location: the place the dish comes from, including one implied by its name
      ("Brelish ..." → Breland).
      served_in: places where it is served or eaten. A dish listed in a box, menu or list
      for a city, tavern or restaurant is served in that place.
      DO NOT extract:
        - Drinks of any kind: use the drinks array
        - Generic food references: "food", "a meal", "rations", "provisions", "supplies"
        - Dining occasions or events: "the feast", "a banquet", "dinner", "a meal together"
        - Raw ingredients without a named dish: "mushrooms", "meat", "herbs", "spices"
      GOOD examples: "fried stirge wings", "Boromar Clan clawfoot stew",
      "Brelish Shawarma with Goblin sauce" (origin Breland, served in Stormreach when listed
      in Stormreach's box)
      BAD examples: "food", "a meal", "rations", "the feast", "mushrooms", "Aundairian wine" (drink)
    llm_schema:
      name: "canonical dish name"
      aliases:
        - "other names"
      description: "description of the dish, or null"
      cuisine_type: "cultural or regional cuisine type or null"
      origin_location: "place this dish comes from (also when implied by its name), or null"
      served_in:
        - "places where it is served (city, tavern, restaurant)"
      ingredients:
        - "ingredients named in the text"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Drink:
    uri_suffix: Drink
    llm_key: drinks
    subtype_field: drink_type
    subtypes:
      Wine: Wine
      Beer: Beer
      Spirit: Spirit
      Cocktail: Cocktail
    datatype_properties:
      description: description
    list_datatype_properties:
      ingredients: ingredient
    list_object_properties:
      served_in: servedIn
    reverse_object_properties:
      # origin_location → location cs:produces current drink
      origin_location: produces
    notes: |
      DRINKS: Extract ONLY named specific drinks: wines, beers, ales, spirits, cocktails, teas.
      REQUIRED: must have a proper name or a named origin ("Aundairian wine", "Fireheart ale").
      drink_type: Wine for wines; Beer for beer, ale, mead; Spirit for brandy, whiskey and other
      distilled liquor; Cocktail for mixed drinks; Other for anything else.
      Short entries count: a one-line item in a menu, list or box is a drink.
      origin_location: where it is made (winery, brewery, region, nation), also when implied
      by its name ("Aundairian wine" → Aundair).
      served_in: places where it is served. A drink listed in a box, menu or list for a city,
      tavern or restaurant is served in that place.
      DO NOT extract:
        - Generic drinks: "wine", "ale", "a drink", "water", "spirits"
        - Potions: magic potions are items (item_type Potion)
      GOOD examples: "Aundairian wine", "Zil brandy", "Dragon's Breath" (cocktail)
      BAD examples: "wine", "a mug of ale", "potion of healing" (item)
    llm_schema:
      name: "canonical drink name"
      aliases:
        - "other names"
      drink_type: "Wine|Beer|Spirit|Cocktail|Other"
      description: "description of the drink, or null"
      origin_location: "place where it is made (winery, brewery, region, nation), or null"
      served_in:
        - "places where it is served (city, tavern, restaurant)"
      ingredients:
        - "ingredients named in the text"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Material:
    uri_suffix: Material
    llm_key: materials
    subtype_field: material_type
    subtypes:
      Metal: Metal
      Gem: Gem
      Textile: Textile
      CraftingMaterial: CraftingMaterial
    datatype_properties:
      description: description
    reverse_list_object_properties:
      # found_in location → location cs:produces current material
      found_in: produces
    notes: |
      MATERIALS: Extract ONLY named raw materials and resources: metals and ores, gems and
      crystals, textiles and fibers, and special crafting materials.
      material_type: Metal for metals and ores (adamantine, mithral, byeshk); Gem for gems and
      crystals (Siberys dragonshards, Eberron dragonshards); Textile for cloths and fibers
      (glamerweave, spidersilk); CraftingMaterial for everything else (soarwood, darkwood,
      densewood); Other if unsure.
      DO NOT extract:
        - Finished objects: those are items
        - Generic materials: "wood", "stone", "iron ore" with no special name
      GOOD examples: "Byeshk", "Siberys dragonshard", "Soarwood", "Glamerweave"
      BAD examples: "wood", "metal", "a gem", "Cloak of Elvenkind" (item)
    llm_schema:
      name: "canonical material name"
      aliases:
        - "other names"
      material_type: "Metal|Gem|Textile|CraftingMaterial|Other"
      description: "brief description and uses"
      found_in:
        - "mines, regions or nations where it is found or produced"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Language:
    uri_suffix: Language
    llm_key: languages
    subtype_field: language_kind
    subtypes:
      Language: Language
      Dialect: Dialect
      Creole: Creole
      Pidgin: Pidgin
      Code: CodeLanguage
    datatype_properties:
      description: description
      language_family: languageFamily
    enum_datatype_properties:
      status:
        property: status
        values: [current, past]
    list_datatype_properties:
      scripts: script
      formats: format
    object_properties:
      dialect_of: dialectOf
    list_object_properties:
      spoken_by_races: spokenByRace
      spoken_by_factions: spokenByFaction
      spoken_in: spokenIn
      descends_from: descendsFrom
    notes: |
      LANGUAGES: Extract ONLY named languages, dialects, creoles, pidgins, sign languages and
      coded languages (thieves' cants, military codes).
      REQUIRED: must be a proper named language — not a book, scroll, or act of communication.
      language_kind: Dialect if it is a dialect of another language (set dialect_of); Creole or
      Pidgin when the text says so (list the parent languages in descends_from); Code for
      cants, ciphers and secret codes; otherwise Language.
      status: "past" for dead or extinct languages (often marked †), otherwise "current".
      scripts: names of the scripts it is written in. A script name is NOT a separate language
      unless the text describes it as a spoken language too.
      DO NOT extract:
        - Individual texts or written works: use items array for scrolls, books, etc.
        - Generic references: "the written word", "a foreign language", "an ancient script"
        - Communication acts: "speech", "writing", "whispering" (not named languages)
      GOOD examples: "Common", "Elvish", "Daelkyr", "Quori", "Goblin", "Thieves' Cant", "Shaaratalk"
      BAD examples: "the ancient script", "a foreign tongue", "secret code", "arcane writing"
    llm_schema:
      name: "canonical language name"
      aliases:
        - "other names"
      language_kind: "Language|Dialect|Creole|Pidgin|Code"
      status: "current|past"
      language_family: "name of the language family, or null"
      descends_from:
        - "languages it descends from"
      dialect_of: "parent language if this is a dialect, or null"
      scripts:
        - "scripts it is written in"
      formats:
        - "spoken|signed|written|telepathic|danced|other"
      description: "brief description"
      spoken_by_races:
        - "race names that natively speak this language"
      spoken_by_factions:
        - "faction names associated with this language"
      spoken_in:
        - "location names where this language is commonly spoken"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Tradition:
    uri_suffix: Tradition
    llm_key: traditions
    datatype_properties:
      description: description
    enum_datatype_properties:
      category:
        property: category
        values: [fashion, etiquette, law, dance, music, art, ritual, cuisine, festival, other]
    list_object_properties:
      practiced_by: practicedBy
    notes: |
      TRADITIONS: Extract named or clearly described cultural customs and practices of a
      specific people: fashion and dress styles, hairstyles and tattoos, etiquette and body
      language, legal and moral codes, dances, music, art forms, rituals, festivals, cuisine
      customs.
      name: the tradition's own name if it has one ("Code of Galifar", "the tago"); otherwise a
      short descriptive name naming the people ("Cyran fashion", "Lhazaar hair-braiding").
      practiced_by: the nations, races or factions that practice it.
      category: one of fashion|etiquette|law|dance|music|art|ritual|cuisine|festival|other.
      DO NOT extract:
        - Game rules or mechanics: "proficiency", "skill challenge"
        - Religions or faiths: use religions array
        - One-off actions of a single NPC
      GOOD examples: "Code of Galifar" (law), "Cyran fashion" (fashion), "Vulkoori tattoos"
      (fashion), "Mror gift culture" (etiquette), "the tago" (dance)
      BAD examples: "tradition", "culture", "fashion" (no people), "The Silver Flame" (religion)
    llm_schema:
      name: "tradition name, or a short descriptive name with the people's name"
      aliases:
        - "other names"
      category: "fashion|etiquette|law|dance|music|art|ritual|cuisine|festival|other"
      practiced_by:
        - "nations, races or factions that practice it"
      description: "what the tradition is, in the text's own terms"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Event:
    uri_suffix: Event
    llm_key: events
    subtype_field: event_type
    subtypes:
      War: War
      Battle: Battle
      Treaty: Treaty
      Disaster: Disaster
      Founding: Founding
      Era: Era
    datatype_properties:
      description: description
    integer_datatype_properties:
      start_year: startYear
      end_year: endYear
    object_properties:
      location: occurredAt
    list_object_properties:
      participants: participant
    notes: |
      EVENTS: Extract ONLY named historical events and eras: wars, battles, treaties,
      disasters, foundings of nations or cities, and named ages or eras.
      event_type: War, Battle, Treaty, Disaster, Founding, Era (a named age or period such as
      "Age of Demons" or "Age of Dhakaan"), or Other.
      YEARS: start_year / end_year only when the text states the year outright. Copy the number
      as written in YK (Year of the Kingdom); years before YK are negative. Never calculate a
      year. If no year is stated, use null.
      DO NOT extract:
        - Things that happen in an adventure's present: "the party arrives"
        - Generic events: "a war", "the battle", "a disaster"
      GOOD examples: "The Last War" (War, 894–996 YK), "Day of Mourning" (Disaster, 994 YK),
      "Treaty of Thronehold" (Treaty, 996 YK), "Sundering of Sarlona", "Age of Demons" (Era)
      BAD examples: "the war" (unnamed), "a battle", "the attack"
    llm_schema:
      name: "canonical event name"
      aliases:
        - "other names"
      event_type: "War|Battle|Treaty|Disaster|Founding|Era|Other"
      start_year: "YK year as written in the text, or null"
      end_year: "YK year as written in the text, or null"
      location: "where it happened, or null"
      participants:
        - "NPCs, factions or nations that took part"
      description: "brief description"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Item:
    uri_suffix: Item
    llm_key: items
    subtype_field: item_type
    subtypes:
      Attire:
        class: Attire
        parents: [Item]
      Book:
        class: Book
        parents: [Item]
      Wondrous:
        class: WondrousItem
        parents: [MagicItem, Item]
      Potion:
        class: Potion
        parents: [MagicItem, Item]
      Scroll:
        class: Scroll
        parents: [MagicItem, Item]
      Staff:
        class: Staff
        parents: [MagicItem, Item]
      Wand:
        class: Wand
        parents: [MagicItem, Item]
      Ring:
        class: Ring
        parents: [MagicItem, Item]
      Rod:
        class: Rod
        parents: [MagicItem, Item]
      Armor:
        class: MagicArmor
        parents: [MagicItem, Item]
      Weapon:
        class: MagicWeapon
        parents: [MagicItem, Item]
    default_subtype:
      class: MagicItem
      parents: [Item]
    datatype_properties:
      description: description
      rarity: rarity
      requires_attunement: requiresAttunement
      charges: charges
    object_properties:
      author: author
      language: writtenIn
    notes: |
      ITEMS: Extract ONLY named objects: magic items, named garments, and named in-game books.
      REQUIRED: must have a proper name — not a generic description of an object.
      DO NOT extract:
        - Generic mundane objects: "a sword", "armor", "a bag", "rations", "a torch"
        - Unnamed possessions: "her father's sword", "his old cloak", "a magic ring" (no name)
        - Item categories used as labels: "weapons", "armor", "potions" (only specific named items)
        - Real-world sourcebooks (e.g. "Eberron: Rising from the Last War") — never items
      Use item_type "Attire" for any named clothing, fashion garment, costume, or worn
      accessory, magical or not.
      Use item_type "Book" for a named book, tome, manual or treatise that exists inside the
      world ("The Ender Disquisition", "The Rekkenmark Manual"); fill author and language.
      GOOD examples: "Cloak of Elvenkind", "Casual Attire", "Stunning Attire", "Javelin of
      Lightning", "The Ender Disquisition"
      BAD examples: "a sword", "her cloak", "magic ring" (no proper name), "weapons", "armor"
    llm_schema:
      name: "canonical item name"
      item_type: "Attire|Book|Potion|Scroll|Staff|Wand|Ring|Rod|Armor|Weapon|Wondrous"
      aliases:
        - "other names"
      description: "brief description"
      rarity: "common|uncommon|rare|very rare|legendary|artifact or null"
      requires_attunement: "no|yes|by a [class/race/alignment] or null"
      charges: "number or null"
      author: "author of a book, or null"
      language: "language a book is written in, or null"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Creature:
    uri_suffix: Creature
    llm_key: creatures
    subtype_field: creature_type
    subtypes:
      Aberration:
        class: Aberration
        parents: [CreatureType, Creature]
      Beast:
        class: Beast
        parents: [CreatureType, Creature]
      Celestial:
        class: Celestial
        parents: [CreatureType, Creature]
      Construct:
        class: Construct
        parents: [CreatureType, Creature]
      Dragon:
        class: Dragon
        parents: [CreatureType, Creature]
      Elemental:
        class: Elemental
        parents: [CreatureType, Creature]
      Fey:
        class: Fey
        parents: [CreatureType, Creature]
      Fiend:
        class: Fiend
        parents: [CreatureType, Creature]
      Giant:
        class: Giant
        parents: [CreatureType, Creature]
      Humanoid:
        class: Humanoid
        parents: [CreatureType, Creature]
      Monstrosity:
        class: Monstrosity
        parents: [CreatureType, Creature]
      Ooze:
        class: Ooze
        parents: [CreatureType, Creature]
      Plant:
        class: Plant
        parents: [CreatureType, Creature]
      Undead:
        class: Undead
        parents: [CreatureType, Creature]
    default_subtype:
      class: CreatureType
      parents: [Creature]
    datatype_properties:
      description: description
      challenge_rating: challengeRating
      alignment: alignment
      size: size
      habitat: habitat
    list_object_properties:
      found_in: foundIn
    notes: |
      CREATURES: Extract ONLY named creature species or individual monsters with stat blocks
      or specific lore detail.
      REQUIRED: must be a named creature type or specific individual monster — not a generic category.
      DO NOT extract:
        - Generic creature categories without a proper name: "goblins", "wolves", "dragons", "undead"
        - Named NPCs: a named person who happens to be non-human is an NPC — use npcs array
        - Player character species: "Warforged", "Kalashtar", "Shifter" — use races array for those
        - Vague references: "the beast", "a monster", "some creatures", "the undead horde"
      GOOD examples: "Daan Strider", "Blade Worm", "Zakya Rakshasa", "Valenar Horse", "Dolgrim"
      BAD examples: "goblin" (generic), "the dragon" (unnamed), "undead" (category), "Lakashtai" (NPC)
    llm_schema:
      name: "creature name"
      aliases:
        - "other names or variant forms"
      creature_type: "Aberration|Beast|Celestial|Construct|Dragon|Elemental|Fey|Fiend|Giant|Humanoid|Monstrosity|Ooze|Plant|Undead|Other"
      challenge_rating: "CR as string like '1/2', '5', '20' or null"
      alignment: "alignment string or null"
      size: "Tiny|Small|Medium|Large|Huge|Gargantuan or null"
      habitat: "typical environment or null"
      found_in:
        - "location names"
      description: "brief description"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"
