{{- if .Values.llmServer.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-nvidia-device-plugin
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "csqe.selectorLabels" (dict "root" . "component" "nvidia-device-plugin") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "csqe.selectorLabels" (dict "root" . "component" "nvidia-device-plugin") | nindent 8 }}
    spec:
      # Only scheduled onto the node k3s-anywhere's GPU cloud-init labels —
      # never runs (and never crash-loops) on CPU-only nodes.
      nodeSelector:
        {{- toYaml .Values.llmServer.nodeSelector | nindent 8 }}
      priorityClassName: system-node-critical
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin
          image: "{{ .Values.nvidiaDevicePlugin.image.repository }}:{{ .Values.nvidiaDevicePlugin.image.tag }}"
          securityContext:
            privileged: true
          # k3s-anywhere sets containerd's default_runtime_name to "nvidia"
          # rather than registering a formal RuntimeClass, so the legacy
          # nvidia-container-runtime only injects the driver/devices into a
          # container when these are set — without them every container
          # (including this one) runs as plain runc, the plugin can't load
          # NVML, and it crash-loops with "Incompatible strategy detected
          # auto".
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
{{- end }}
