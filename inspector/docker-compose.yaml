services:

  fuseki:
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: localdevpassword
      JVM_ARGS: "-Xmx2g"
    volumes:
      - inspector-fuseki-data:/fuseki-base
      - ../config/ontology.ttl:/ontology/ontology.ttl:ro
      - ../config/fuseki-config.ttl:/etc/fuseki/configuration/config.ttl:ro
    ports:
      - "3030:3030"
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3030/$/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - inspector-redis-data:/data
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - inspector-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  pdf-worker:
    build:
      context: ..
      dockerfile: pdf_worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      LOCK_TTL_SECONDS: "120"
      POLL_INTERVAL_SECONDS: "5"
      PYTHONUNBUFFERED: "1"
    networks:
      - mcp-network
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  graph-worker:
    build:
      context: ..
      dockerfile: graph_worker/Dockerfile
    env_file:
      - .env
    environment:
      FUSEKI_ENDPOINT: http://fuseki:3030/campaign
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      LLAMA_CPP_HOST: ${LLAMA_CPP_HOST:-http://host.docker.internal:8080/v1}
      LOCK_TTL_SECONDS: "300"
      POLL_INTERVAL_SECONDS: "10"
      INGESTION_CONFIG_PATH: /config/ingestion_config.yaml
      LLM_CONFIG_PATH: /config/llm.yaml
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../config/ingestion_config.yaml:/config/ingestion_config.yaml:ro
      - ../config/llm.yaml:/config/llm.yaml:ro
    networks:
      - mcp-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      fuseki:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  mcp-server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "8000:8000"
    environment:
      FUSEKI_ENDPOINT: http://fuseki:3030/campaign
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      PYTHONUNBUFFERED: "1"
    networks:
      - mcp-network
    depends_on:
      fuseki:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 5s
      retries: 10
      start_period: 15s

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      MCP_SERVER_URL: http://mcp-server:8000
      POLL_INTERVAL_SECONDS: "10"
      PYTHONUNBUFFERED: "1"
    networks:
      - mcp-network
    depends_on:
      mcp-server:
        condition: service_healthy

  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector
    entrypoint: ["node", "/app/client/bin/start.js", "--transport", "streamable-http", "--server-url", "http://mcp-server:8000/mcp"]
    ports:
      - "127.0.0.1:6274:6274"
      - "127.0.0.1:6277:6277"
    networks:
      - mcp-network
    depends_on:
      mcp-server:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=http://127.0.0.1:6274,http://localhost:6274
      - DANGEROUSLY_OMIT_AUTH=true

networks:
  mcp-network:
    driver: bridge

volumes:
  inspector-fuseki-data:
  inspector-redis-data:
  inspector-minio-data:
