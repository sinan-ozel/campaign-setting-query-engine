{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Name }}-letsencrypt
  labels:
    {{- include "csqe.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.certManager.issuer.server | quote }}
    email: {{ .Values.certManager.issuer.email | required "certManager.issuer.email is required when certManager.enabled=true" | quote }}
    privateKeySecretRef:
      name: {{ .Release.Name }}-letsencrypt-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
{{- end }}
