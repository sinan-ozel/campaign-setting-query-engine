[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-setting-query-engine"
dynamic = ["version"]
description = "Knowledge graph-backed MCP server for precision lore retrieval from tabletop RPG sourcebooks"
readme = "README.md"
authors = [
    { name = "Sinan Ozel", email = "coding@sinan.slmail.me" },
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=3.2.4",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0.0",
    "httpx>=0.28.0",
    "redis>=5.0.0",
    "minio>=7.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
pdf = [
    "pymupdf-layout==1.27.1",
    "pymupdf4llm==0.3.4",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
    "minio>=7.0.0",
]

graph = [
    "fastembed>=0.8.0",
    "litellm>=1.87.0",
    "tiktoken>=0.6.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
    "minio>=7.0.0",
    "httpx>=0.28.0",
]

dashboard = [
    "streamlit>=1.30.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-anyio>=0.0.0",
    "pytest-mock>=3.14.0",
    "pytest-mcp-tools==0.2.1",
    "pytest-depends>=1.0.1",
    "httpx>=0.28.1",
    "minio>=7.0.0",
    "redis>=5.0.0",
]

dev = [
    "ruff>=0.12.11",             # For linting
    "isort>=5.0.0",              # For sorting imports
    "black>=24.0.0",             # For code formatting
    "docformatter>=1.7.5",       # For formatting docstrings
]

docs = [
    "mkdocs-material>=9.0.0",           # Material theme for MkDocs
    "mkdocstrings[python]>=0.24.0",     # API documentation from docstrings
    "mike",                              # For versioned docs deployment
]

publish = [
    "packaging>=25.0",
]

[tool.isort]
profile = "black"

[tool.ruff.lint]
select = ["I", "F", "E", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["RUF001"]

[tool.black]
line-length = 80
target-version = ['py311']

[tool.docformatter]
wrap-summaries = 79
wrap-descriptions = 79
in-place = true
recursive = true

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.setuptools.dynamic]
version = { attr = "server.__version__" }

[project.urls]
Homepage = "https://github.com/sinan-ozel/campaign-setting-query-engine"
Issues = "https://github.com/sinan-ozel/campaign-setting-query-engine/issues"
Documentation = "https://sinan-ozel.github.io/campaign-setting-query-engine/"
