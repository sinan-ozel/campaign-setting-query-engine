namespace: "http://campaignsetting.io/ontology#"

# ── All types queryable via list_entities / get_entity / search_by_property ──
# To add a new queryable type: add an entry here AND an entity_type entry below.
queryable_types:
  # Characters
  NPC: NPC
  # Factions and social groups
  Faction: Faction
  Newspaper: Newspaper
  DragonmarkedHouse: DragonmarkedHouse
  Family: Family
  # Beliefs
  Religion: Religion
  Deity: Deity
  # Species and classes
  Race: Race
  CharacterClass: CharacterClass
  Skill: Skill
  Feat: Feat
  # Culture
  Language: Language
  Dish: Dish
  # Creatures
  Creature: Creature
  CreatureType: CreatureType
  # Locations — broad
  Location: Location
  Continent: Continent
  Nation: Nation
  Region: Region
  # Locations — settlements
  City: City
  Ward: Ward
  Neighborhood: Neighborhood
  Tavern: Tavern
  Shop: Shop
  # Locations — terrain
  River: River
  Sea: Sea
  Mountain: Mountain
  MountainRange: MountainRange
  Forest: Forest
  Jungle: Jungle
  Desert: Desert
  Plain: Plain
  Island: Island
  # Locations — structures and planes
  Dungeon: Dungeon
  Ruin: Ruin
  Plane: Plane
  Moon: Moon
  # Items
  Item: Item
  MagicItem: MagicItem
  WondrousItem: WondrousItem
  Attire: Attire
  MagicArmor: MagicArmor
  MagicWeapon: MagicWeapon
  Potion: Potion
  Ring: Ring
  Rod: Rod
  Scroll: Scroll
  Staff: Staff
  Wand: Wand

# ── Traversable relationship edges (get_relationships) ────────────────────────
# key = name callers use in the API, value = cs: property suffix
relationship_properties:
  allies: alliedWith
  enemies: enemyOf
  sibling: siblingOf
  spouse: spouseOf
  members: memberOf
  operatesIn: operatesIn
  contains: contains
  worships: worships
  hasPotentialMotive: hasPotentialMotive
  controlledBy: controlledBy
  locatedIn: locatedIn
  nationality: nationality
  hasEquipment: hasEquipment
  memberFamilyOf: memberFamilyOf
  foundIn: foundIn
  grantedSpell: grantedSpell
  craftedBy: craftedBy
  attuneRequiredClass: attuneRequiredClass
  itemFoundIn: itemFoundIn

# ── Properties accepted by search_by_property ─────────────────────────────────
allowed_filter_properties:
  - nationality
  - alignment
  - ancestry
  - physicalDescription
  - level
  - wantsAndNeeds
  - worships
  - memberOf
  - leaderOf
  - locatedIn
  - controlledBy
  - factionType
  - factionClass
  - dragonmark
  - description
  - alias
  - canonicalName
  - pageNumber
  - edition
  - canonType
  - publisher
  - factionLocatedIn
  - operatesIn
  - dominantReligion
  - typicalClass
  - nativeRegion
  - hasRace
  - hasClass
  - hasSkill
  - climate
  - ambiance
  - prerequisites
  - cuisineType
  - originLocation
  - itemCategory
  - rarity
  - requiresAttunement
  - charges
  - rechargeCondition
  - bodySlot
  - grantedSpell
  - craftedBy
  - attuneRequiredClass
  - itemFoundIn
  - writingSystem
  - spokenIn
  - challengeRating
  - size
  - habitat
  - foundIn

# ── Entity types ───────────────────────────────────────────────────────────────
# Any entity_type with a llm_key is extracted by the LLM and written to the graph.
# Entity types without llm_key appear only in queryable_types (subtypes written
# as rdf:type triples by their parent entity's handler).
#
# Property maps drive the generic mapper — no Python changes needed to add fields:
#
#   datatype_properties:       {llm_field: cs_suffix}  scalar string → literal triple
#   list_datatype_properties:  {llm_field: cs_suffix}  list of strings → one triple each
#   object_properties:         {llm_field: cs_suffix}  name → URI, current → cs:prop → target
#   list_object_properties:    {llm_field: cs_suffix}  list of names → one URI triple each
#   reverse_object_properties: {llm_field: cs_suffix}  target → cs:prop → current
#                              (for parent_location → parent contains child,
#                               leader → leader leaderOf faction)
#   symmetric_object_properties: {llm_field: cs_suffix}  write both directions
#
#   relationship_types:        dispatch table for the "relationships" array field
#     rel_type:
#       property: cs_suffix
#       symmetric: true|false
#
#   subtype_field: which LLM field selects a subclass of the root uri_suffix
#   subtypes:
#     LlmValue: ClassName           (string → explicit parent = uri_suffix)
#     LlmValue:                     (dict → explicit parents listed)
#       class: ClassName
#       parents: [ParentA, ParentB]
#
# To add a new simple field to an entity type: add one line under the right
# property map in that entity's section below. No Python edits needed.
entity_types:

  NPC:
    uri_suffix: NPC
    llm_key: npcs
    datatype_properties:
      description: description
      alignment: alignment
      ancestry: ancestry
      physical_description: physicalDescription
      level: level
      wants_and_needs: wantsAndNeeds
      secrets: secret
      actions: action
    list_datatype_properties:
      potential_goals: potentialGoal
    object_properties:
      race: hasRace
      character_class: hasClass
      nationality: nationality
      location: locatedIn
      worships: worships
    list_object_properties:
      equipment: hasEquipment
      factions: memberOf
    relationship_types:
      ally:
        property: alliedWith
        symmetric: false
      enemy:
        property: enemyOf
        symmetric: true
      sibling:
        property: siblingOf
        symmetric: true
      spouse:
        property: spouseOf
        symmetric: true
    notes: |
      NPCS: Extract ONLY specific, named individuals — a person who has a proper name
      and an established identity in the setting.
      REQUIRED: the entity must have a real proper name (e.g. "Lakashtai", "King Boranel",
      "Lord of Blades"). A title alone with no name does NOT qualify.
      DO NOT extract:
        - Character backgrounds or archetypes: "noble", "criminal", "urchin", "entertainer"
        - Generic roles: "the wizard", "the paladin", "a bard", "your character"
        - Hypothetical examples used to illustrate rules: "if you play a noble..."
        - Creature types or races: use creatures/races arrays for those
        - Player characters or player character options
        - Organizations or factions: use factions array for those
      GOOD examples: "Lakashtai", "Jaela Daran", "Boranel ir'Wynarn", "The Mourning King"
      BAD examples: "noble", "urchin", "wizard", "the bard", "a Boromar crime boss"
    llm_schema:
      name: "canonical name as written"
      aliases:
        - "titles, other names"
      race: "race name or null"
      ancestry: "specific lineage, heritage, or cultural background beyond race, or null"
      character_class: "class(es) like 'Fighter' or 'Fighter/Rogue' or null"
      level: "level like '5' or multiclass like 'Fighter 5/Rogue 3' or null"
      alignment: "alignment string or null"
      nationality: "nation name or null"
      location: "primary location or null"
      factions:
        - "faction names"
      worships: "deity name or null"
      physical_description: "brief physical appearance or null"
      equipment:
        - "item names this NPC carries or wears"
      potential_goals:
        - "brief goal description"
      wants_and_needs: "what this NPC fundamentally wants or needs or null"
      secrets: "information this NPC is hiding (GM note) or null"
      actions: "notable combat actions or special abilities or null"
      potential_motives:
        - summary: "one sentence"
          source_quote: "verbatim text or null"
      description: "brief description"
      relationships:
        - target: "entity name"
          type: "ally|enemy|rival|mentor|subordinate|sibling|spouse|other"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Location:
    uri_suffix: Location
    llm_key: locations
    notes: |
      LOCATIONS: Extract ONLY specifically named places with a proper name.
      REQUIRED: the place must have a distinct proper name — not just a description of terrain
      or a generic word like "the city" or "a tavern".
      DO NOT extract:
        - Generic terrain without a name: "the forest", "a river", "some mountains"
        - Generic structures: "a tavern", "the shop", "a dungeon", "the ruins"
        - Vague directional references: "the city to the north", "a nearby town"
        - Hypothetical or tutorial example places that are clearly made up to illustrate a rule
      GOOD examples: "Sharn", "Khorvaire", "The Mournland", "The Cogs", "Lake Galifar"
      BAD examples: "the city", "a tavern", "the forest", "some ruins", "a mysterious cave"
      NATION vs LANGUAGE — adjective and demonym forms: A proper nation name like "Breland"
      is a Location (type: Nation). The adjective or demonym form of a nation name — words
      ending in -ish, -an, -ite, -ese, -i, or similar that derive from a nation name —
      (e.g. "Brelish" from "Breland", "Aundairian" from "Aundair", "Karrnathi" from "Karrnath")
      is almost always a LANGUAGE, not a Location. Put the adjective form in the languages array,
      not locations. Extract the nation as a Location; extract its adjective form as a Language.
    subtype_field: type
    subtypes:
      Continent: Continent
      Nation: Nation
      Region: Region
      City: City
      Ward: Ward
      Neighborhood: Neighborhood
      Tavern: Tavern
      Shop: Shop
      River: River
      Sea: Sea
      Mountain: Mountain
      MountainRange: MountainRange
      Forest: Forest
      Jungle: Jungle
      Desert: Desert
      Plain: Plain
      Island: Island
      Dungeon: Dungeon
      Ruin: Ruin
      Plane: Plane
      Moon: Moon
    datatype_properties:
      description: description
      climate: climate
      ambiance_description: ambiance
    object_properties:
      controlling_faction: controlledBy
    reverse_object_properties:
      # parent_location → parent cs:contains current (subject is the parent)
      parent_location: contains
    llm_schema:
      name: "canonical name"
      aliases:
        - "other names"
      type: "Continent|Nation|Region|City|Ward|Neighborhood|Tavern|Shop|River|Sea|Mountain|MountainRange|Forest|Jungle|Desert|Plain|Island|Dungeon|Ruin|Plane|Moon|Other"
      parent_location: "immediately containing location or null"
      controlling_faction: "faction name or null"
      climate: "climate description or null"
      ambiance_description: "atmosphere, mood, sensory details or null"
      description: "brief description"
      notable_npcs:
        - "NPC names"
      connected_locations:
        - "location names"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Faction:
    uri_suffix: Faction
    llm_key: factions
    notes: |
      FACTIONS: Extract ONLY named organizations or groups with a distinct proper name.
      Includes guilds, crime families, dragonmarked houses, military orders, spy agencies,
      newspapers, noble houses, merchant consortiums, and religious orders.
      REQUIRED: must have a proper name — not a generic role or category label.
      DO NOT extract:
        - Generic group references: "the guards", "bandits", "the army", "the watch"
        - Government titles without a name: "the crown", "the council", "the senate"
        - Cultural or racial groups: "the elves", "humans", "Aundairians"
        - Vague references: "a criminal organization", "some mercenaries", "the enemy"
      GOOD examples: "House Cannith", "The Boromar Clan", "The Royal Eyes of Aundair", "The Sharn Watch"
      BAD examples: "the guards", "bandits", "the army", "an adventuring party", "the thieves"
    subtype_field: faction_class
    subtypes:
      Newspaper: Newspaper
      DragonmarkedHouse: DragonmarkedHouse
      Family: Family
    datatype_properties:
      type: factionType
      dragonmark: dragonmark
    object_properties:
      headquarters: factionLocatedIn
      parent_house: memberFamilyOf
    reverse_object_properties:
      # leader → leader cs:leaderOf current faction (subject is the leader)
      leader: leaderOf
    list_object_properties:
      operates_in: operatesIn
    symmetric_object_properties:
      allies: factionAlly
      enemies: factionEnemy
    llm_schema:
      name: "canonical name"
      aliases:
        - "other names"
      faction_class: "Faction|Newspaper|DragonmarkedHouse|Family"
      type: "Military|Criminal|Religious|Political|Mercantile|Arcane|Druidic|Press|Noble|Other"
      headquarters: "location name or null"
      leader: "NPC name or null"
      dragonmark: "name of the dragonmark this house bears, or null"
      parent_house: "DragonmarkedHouse name if this is a Family, or null"
      members:
        - "notable NPC names"
      potential_motives:
        - summary: "one sentence"
          source_quote: "text or null"
      allies:
        - "faction names"
      enemies:
        - "faction names"
      operates_in:
        - "location names"
      worships: "deity name or null"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Religion:
    uri_suffix: Religion
    llm_key: religions
    notes: |
      RELIGIONS: Extract ONLY named religious systems, faiths, or organized spiritual movements.
      REQUIRED: must be a named faith or system — individual deities go in the deities array.
      DO NOT extract:
        - Individual divine beings: put those in the deities array instead
        - Abstract concepts: "worship", "faith", "prayer", "divine magic", "spirituality"
        - Generic references: "a religion", "the faith", "their beliefs", "the church"
      GOOD examples: "The Silver Flame", "The Sovereign Host", "The Blood of Vol", "Path of Light"
      BAD examples: "The Traveler" (deity — use deities), "worship", "faith", "the church"
    datatype_properties:
      description: description
    object_properties:
      primary_deity: primaryDeity
    llm_schema:
      name: "canonical religion name"
      aliases:
        - "other names"
      primary_deity: "deity name or null"
      deities:
        - "all associated deity names"
      worshipping_factions:
        - "faction names"
      dominant_in:
        - "nation names"
      description: "brief description"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Deity:
    uri_suffix: Deity
    llm_key: deities
    notes: |
      DEITIES: Extract ONLY named divine beings, gods, or named spiritual entities.
      REQUIRED: must be a named individual divine being with a proper name or established title.
      DO NOT extract:
        - Religious systems or faiths: put those in the religions array instead
        - Abstract concepts: "the divine", "godhood", "divine power", "holy energy"
        - Generic references: "a god", "the deity", "divine beings", "the gods" (plural generic)
      GOOD examples: "Boldrei", "The Traveler", "The Devourer", "The Keeper", "Vol", "Aureon"
      BAD examples: "god", "divine", "the gods", "divine power", "a dark deity"
    datatype_properties:
      description: description
      alignment: alignment
    object_properties:
      religion: deityOf
    llm_schema:
      name: "canonical deity name"
      aliases:
        - "titles, epithets"
      religion: "parent religion or null"
      alignment: "alignment or null"
      domains:
        - "divine domain names"
      description: "brief description"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Race:
    uri_suffix: Race
    llm_key: races
    notes: |
      RACES: Extract ONLY named biological species or ancestry types that characters can belong to.
      REQUIRED: must be a proper named species — not a nationality, profession, or background.
      DO NOT extract:
        - Nationalities or cultural identities: "Aundairian", "Karrnathi", "Cyran" — those are not races
        - Character backgrounds: "noble", "criminal", "soldier", "sage", "folk hero"
        - Generic humanoid groupings: "humanoid", "mortal", "the people", "men"
        - Creatures already in the creatures array: use creatures for monster species
      GOOD examples: "Warforged", "Kalashtar", "Changeling", "Shifter", "Half-Elf", "Gnome"
      BAD examples: "Aundairian" (nationality), "noble" (background), "humanoid" (generic), "soldier"
    datatype_properties:
      description: description
    list_object_properties:
      native_regions: nativeRegion
    llm_schema:
      name: "canonical race name"
      aliases:
        - "other names or subtypes"
      description: "brief description"
      typical_classes:
        - "class names"
      native_regions:
        - "location names"
      notable_npcs:
        - "named individuals"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  CharacterClass:
    uri_suffix: CharacterClass
    llm_key: classes
    datatype_properties:
      description: description
    notes: |
      CLASSES: Extract ONLY named character classes, subclasses, archetypes, and prestige paths.
      REQUIRED: must be a named class or specialization that characters can pursue.
      DO NOT extract:
        - Character backgrounds: "criminal", "noble", "sailor", "hermit", "sage" — NOT classes
        - Racial traits or features: "Dragonmark", "Shifting" — NOT classes
        - Generic concepts: "magic-user", "warrior", "healer", "fighter type"
      GOOD examples: "Artificer", "Battle Smith", "Fashion Designer", "Circle of the Moon", "Battle Master"
      BAD examples: "criminal" (background), "noble" (background), "magic-user" (generic), "healer"
    llm_schema:
      name: "canonical class name"
      aliases:
        - "variants"
      description: "brief description"
      associated_skills:
        - "skill names"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Skill:
    uri_suffix: Skill
    llm_key: skills
    datatype_properties:
      description: description
    notes: |
      SKILLS: Extract ONLY named discrete abilities, powers, or proficiencies characters can use.
      REQUIRED: must have a specific proper name — not a generic game mechanic concept.
      DO NOT extract:
        - Abstract mechanics: "proficiency", "advantage", "expertise", "spell slot", "bonus action"
        - Generic concepts: "magic", "combat training", "stealth" (unless it is a named skill)
        - Class features that are not named abilities
      GOOD examples: "Telekinesis", "Mind Blast", "Sneak Attack", "Arcana", "Channel Divinity"
      BAD examples: "proficiency", "advantage", "spellcasting" (generic), "combat ability", "bonus action"
    llm_schema:
      name: "canonical skill name"
      aliases:
        - "other names"
      description: "brief description"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Feat:
    uri_suffix: Feat
    llm_key: feats
    datatype_properties:
      description: description
      prerequisites: prerequisites
    notes: |
      FEATS: Extract ONLY named character-build options that players select: feats and passive
      special abilities taken at level-up.
      REQUIRED: must be a distinct named feat or talent a character can choose to take.
      DO NOT extract:
        - Active combat abilities or powers: use skills array for those
        - Abstract game mechanics: "bonus action", "reaction", "saving throw", "hit points"
        - Class or racial features that are not standalone selectable feats
      GOOD examples: "War Caster", "Alert", "Psionic Adept", "Sentinel", "Mage Slayer"
      BAD examples: "bonus action", "proficiency bonus", "saving throw advantage", "extra attack"
    llm_schema:
      name: "canonical feat name"
      aliases:
        - "other names"
      description: "what this feat grants"
      prerequisites: "requirements to take this feat or null"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Dish:
    uri_suffix: Dish
    llm_key: dishes
    datatype_properties:
      description: description
      cuisine_type: cuisineType
      origin_location: originLocation
    notes: |
      DISHES: Extract ONLY named specific foods, drinks, or culinary preparations.
      REQUIRED: must be a named dish or drink — not a generic food category or occasion.
      DO NOT extract:
        - Generic food references: "food", "a meal", "rations", "provisions", "supplies"
        - Dining occasions or events: "the feast", "a banquet", "dinner", "a meal together"
        - Raw ingredients without a named dish: "mushrooms", "meat", "herbs", "spices"
      GOOD examples: "Aundairian wine", "fried stirge wings", "Boromar Clan clawfoot stew"
      BAD examples: "food", "a meal", "rations", "the feast", "mushrooms", "meat"
    llm_schema:
      name: "canonical dish name"
      aliases:
        - "other names"
      description: "description of the dish or drink"
      cuisine_type: "cultural or regional cuisine type or null"
      origin_location: "location where this dish originates or null"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Language:
    uri_suffix: Language
    llm_key: languages
    datatype_properties:
      description: description
      writing_system: writingSystem
    list_object_properties:
      spoken_by_races: spokenByRace
      spoken_by_factions: spokenByFaction
      spoken_in: spokenIn
    notes: |
      LANGUAGES: Extract ONLY named languages, dialects, scripts, or coded communication systems.
      REQUIRED: must be a proper named language — not a book, scroll, or act of communication.
      DO NOT extract:
        - Individual texts or written works: use items array for scrolls, books, etc.
        - Generic references: "the written word", "a foreign language", "an ancient script"
        - Communication acts: "speech", "writing", "whispering" (not named languages)
      GOOD examples: "Common", "Elvish", "Daelkyr", "Quori", "Goblin", "Thieves' Cant"
      BAD examples: "the ancient script", "a foreign tongue", "secret code", "arcane writing"
    llm_schema:
      name: "canonical language name"
      aliases:
        - "other names or dialects"
      description: "brief description"
      writing_system: "name of the script or writing system used, or null"
      spoken_by_races:
        - "race names that natively speak this language"
      spoken_by_factions:
        - "faction names associated with this language"
      spoken_in:
        - "location names where this language is commonly spoken"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Item:
    uri_suffix: Item
    llm_key: items
    subtype_field: item_type
    subtypes:
      Attire:
        class: Attire
        parents: [WondrousItem, MagicItem, Item]
      Wondrous:
        class: WondrousItem
        parents: [MagicItem, Item]
      Potion:
        class: Potion
        parents: [MagicItem, Item]
      Scroll:
        class: Scroll
        parents: [MagicItem, Item]
      Staff:
        class: Staff
        parents: [MagicItem, Item]
      Wand:
        class: Wand
        parents: [MagicItem, Item]
      Ring:
        class: Ring
        parents: [MagicItem, Item]
      Rod:
        class: Rod
        parents: [MagicItem, Item]
      Armor:
        class: MagicArmor
        parents: [MagicItem, Item]
      Weapon:
        class: MagicWeapon
        parents: [MagicItem, Item]
    default_subtype:
      class: MagicItem
      parents: [Item]
    datatype_properties:
      description: description
      rarity: rarity
      requires_attunement: requiresAttunement
      charges: charges
    notes: |
      ITEMS: Extract ONLY named objects with magical or notable special properties.
      REQUIRED: must have a proper name — not a generic description of an object.
      DO NOT extract:
        - Generic mundane objects: "a sword", "armor", "a bag", "rations", "a torch"
        - Unnamed possessions: "her father's sword", "his old cloak", "a magic ring" (no name)
        - Item categories used as labels: "weapons", "armor", "potions" (only specific named items)
      Use item_type "Attire" for any named clothing, fashion garment, costume, or worn accessory.
      GOOD examples: "Cloak of Elvenkind", "Casual Attire", "Stunning Attire", "Javelin of Lightning"
      BAD examples: "a sword", "her cloak", "magic ring" (no proper name), "weapons", "armor"
    llm_schema:
      name: "canonical item name"
      item_type: "Attire|Potion|Scroll|Staff|Wand|Ring|Rod|Armor|Weapon|Wondrous"
      aliases:
        - "other names"
      description: "brief description"
      rarity: "common|uncommon|rare|very rare|legendary|artifact or null"
      requires_attunement: "no|yes|by a [class/race/alignment] or null"
      charges: "number or null"
      page_references:
        - "page in current book, or 'BookTitle p.N' for cross-references"

  Creature:
    uri_suffix: Creature
    llm_key: creatures
    subtype_field: creature_type
    subtypes:
      Aberration:
        class: Aberration
        parents: [CreatureType, Creature]
      Beast:
        class: Beast
        parents: [CreatureType, Creature]
      Celestial:
        class: Celestial
        parents: [CreatureType, Creature]
      Construct:
        class: Construct
        parents: [CreatureType, Creature]
      Dragon:
        class: Dragon
        parents: [CreatureType, Creature]
      Elemental:
        class: Elemental
        parents: [CreatureType, Creature]
      Fey:
        class: Fey
        parents: [CreatureType, Creature]
      Fiend:
        class: Fiend
        parents: [CreatureType, Creature]
      Giant:
        class: Giant
        parents: [CreatureType, Creature]
      Humanoid:
        class: Humanoid
        parents: [CreatureType, Creature]
      Monstrosity:
        class: Monstrosity
        parents: [CreatureType, Creature]
      Ooze:
        class: Ooze
        parents: [CreatureType, Creature]
      Plant:
        class: Plant
        parents: [CreatureType, Creature]
      Undead:
        class: Undead
        parents: [CreatureType, Creature]
    default_subtype:
      class: CreatureType
      parents: [Creature]
    datatype_properties:
      description: description
      challenge_rating: challengeRating
      alignment: alignment
      size: size
      habitat: habitat
    list_object_properties:
      found_in: foundIn
    notes: |
      CREATURES: Extract ONLY named creature species or individual monsters with stat blocks
      or specific lore detail.
      REQUIRED: must be a named creature type or specific individual monster — not a generic category.
      DO NOT extract:
        - Generic creature categories without a proper name: "goblins", "wolves", "dragons", "undead"
        - Named NPCs: a named person who happens to be non-human is an NPC — use npcs array
        - Player character species: "Warforged", "Kalashtar", "Shifter" — use races array for those
        - Vague references: "the beast", "a monster", "some creatures", "the undead horde"
      GOOD examples: "Daan Strider", "Blade Worm", "Zakya Rakshasa", "Valenar Horse", "Dolgrim"
      BAD examples: "goblin" (generic), "the dragon" (unnamed), "undead" (category), "Lakashtai" (NPC)
