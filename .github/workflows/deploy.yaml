name: Deploy stack

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Cloud provider"
        required: true
        type: choice
        options:
          - aws
        default: aws
      cluster_name:
        description: "Cluster name (must match CLUSTER_NAME in infrastructure/configs/csqe.env)"
        default: campaign-setting-query-engine
        required: false
        type: string

jobs:
  purge:
    # Must run before restore, not after it (as a step inside deploy):
    # restore-from-backup.sh reuses a fixed PV name (e.g. csqe-redis-data-pv)
    # when restoring from an S3 backup. If a prior failed deploy's atomic
    # rollback left that same-named PV Released (stale claimRef), restore's
    # `kubectl apply` on a new PV with the same name only patches the
    # existing object — it can't rebind an already-Released PV to a new
    # PVC, so the restore silently fails to actually bind. Purging that
    # stale PV first means restore's apply is a genuine fresh create.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      CLUSTER_NAME: ${{ inputs.cluster_name }}
    steps:
      - name: Fetch cluster output
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p infrastructure/state
          docker run --rm \
            -e ACTION=fetch \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_REPO="${{ github.repository }}" \
            -e CLUSTER_NAME="${CLUSTER_NAME}" \
            -e SOPS_AGE_KEY \
            -v ${{ github.workspace }}/infrastructure/state:/output \
            sinanozel/k3s-anywhere:0.2.13

      - name: Purge orphaned storage
        run: |
          docker run --rm \
            -e ACTION=purge \
            -e CLUSTER_NAME="${CLUSTER_NAME}" \
            -v ${{ github.workspace }}/infrastructure/state:/output \
            sinanozel/k3s-anywhere:0.2.13

  restore:
    needs: purge
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      CLUSTER_NAME: ${{ inputs.cluster_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cluster output
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p infrastructure/state
          docker run --rm \
            -e ACTION=fetch \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_REPO="${{ github.repository }}" \
            -e CLUSTER_NAME="${CLUSTER_NAME}" \
            -e SOPS_AGE_KEY \
            -v ${{ github.workspace }}/infrastructure/state:/output \
            sinanozel/k3s-anywhere:0.2.13

      - name: Build restore-runner image
        run: docker build -f restore/Dockerfile -t restore-runner .

      - name: Restore PVCs from latest backup, if any
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e CLUSTER_NAME="${CLUSTER_NAME}" \
            restore-runner

  deploy:
    needs: restore
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      CLUSTER_NAME: ${{ inputs.cluster_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cluster output
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p infrastructure/state
          docker run --rm \
            -e ACTION=fetch \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_REPO="${{ github.repository }}" \
            -e CLUSTER_NAME="${CLUSTER_NAME}" \
            -e SOPS_AGE_KEY \
            -v ${{ github.workspace }}/infrastructure/state:/output \
            sinanozel/k3s-anywhere:0.2.13

      - name: Build deploy-runner image
        run: docker build -f deploy/Dockerfile -t deploy-runner .

      - name: Deploy via deploy-runner
        run: |
          # IMAGE_TAG: leave unset unless vars.IMAGE_TAG is explicitly
          # configured — deploy-k3s.sh's own default (server/__init__.py's
          # exact version) is deliberately used instead of "latest".
          # "latest" is a floating tag: combined with this chart's
          # imagePullPolicy: IfNotPresent, a node that already has an old
          # "latest" image cached will never re-pull it just because the
          # registry's latest now points elsewhere — the pod spec's image
          # string doesn't change, so Helm doesn't even trigger a restart.
          # Pinning to the exact version tag guarantees a real, new image
          # reference on every version bump. This bit us directly:
          # 2026-09-10, a stable 0.1.4 was published but the running pod
          # kept its Sept 6 image because this line pinned "latest".
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e CLUSTER_NAME="${CLUSTER_NAME}" \
            -e IMAGE_ORGANIZATION="${{ secrets.DOCKERHUB_USERNAME }}" \
            -e IMAGE_TAG="${{ vars.IMAGE_TAG }}" \
            -e LLM_IMAGE_TAG="${{ vars.LLM_IMAGE_TAG || 'qwen3.5-9b' }}" \
            -e LETSENCRYPT_EMAIL="${{ secrets.LETSENCRYPT_EMAIL }}" \
            deploy-runner
