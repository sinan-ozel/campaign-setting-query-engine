services:

  fuseki:
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: localdevpassword
      JVM_ARGS: "-Xmx2g"
    volumes:
      - fuseki-data:/fuseki/databases
      - ./config/fuseki-configuration:/fuseki/configuration
      - ./config/ontology.ttl:/ontology/ontology.ttl:ro
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:3030/$$/ping' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      FUSEKI_ENDPOINT: http://fuseki:3030/campaign
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      PYTHONUNBUFFERED: "1"
    depends_on:
      fuseki:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 5s
      retries: 10
      start_period: 15s

  pdf-worker:
    build:
      context: .
      dockerfile: pdf_worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      LOCK_TTL_SECONDS: "120"
      POLL_INTERVAL_SECONDS: "5"
      INPUT_DIR: /input
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./input:/input
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  graph-worker:
    build:
      context: .
      dockerfile: graph_worker/Dockerfile
    environment:
      FUSEKI_ENDPOINT: http://fuseki:3030/campaign
      FUSEKI_USER: admin
      FUSEKI_PASSWORD: localdevpassword
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      LLAMA_CPP_HOST: ${LLAMA_CPP_HOST:-http://host.docker.internal:8080/v1}
      LOCK_TTL_SECONDS: "300"
      POLL_INTERVAL_SECONDS: "10"
      INGESTION_CONFIG_PATH: /config/ingestion_config.yaml
      LLM_CONFIG_PATH: /config/llm.yaml
      CHUNK_DIR: /chunks
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config/ingestion_config.yaml:/config/ingestion_config.yaml:ro
      - ./config/llm.yaml:/config/llm.yaml:ro
      - ./chunks:/chunks
    depends_on:
      fuseki:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      MCP_SERVER_URL: http://mcp-server:8000
      POLL_INTERVAL_SECONDS: "10"
      PYTHONUNBUFFERED: "1"
    depends_on:
      mcp-server:
        condition: service_healthy

volumes:
  fuseki-data:
  redis-data:
  minio-data:
