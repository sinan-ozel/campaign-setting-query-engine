services:
  mcp-server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "8000:8000"
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"localhost\", 8000), timeout=2)' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      - PYTHONUNBUFFERED=1

  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector
    entrypoint: ["node", "/app/client/bin/start.js", "--transport", "streamable-http", "--server-url", "http://mcp-server:8000/mcp"]
    ports:
      - "127.0.0.1:6274:6274"
      - "127.0.0.1:6277:6277"
    networks:
      - mcp-network
    depends_on:
      mcp-server:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=http://127.0.0.1:6274,http://localhost:6274
      - DANGEROUSLY_OMIT_AUTH=true

networks:
  mcp-network:
    driver: bridge
